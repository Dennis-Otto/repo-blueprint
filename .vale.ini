# The style check of the English documents in the Lint workflow, a hint in pull
# requests and never a failure. The styles come from their releases when the check
# runs. A project that needs other rules changes them here; updates keep its change.
# https://github.com/Dennis-Otto/repo-blueprint
StylesPath = .github/vale
MinAlertLevel = warning
Packages = https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip, https://github.com/errata-ai/proselint/releases/download/v0.3.4/proselint.zip

[*.md]
BasedOnStyles = write-good, proselint
# Plain documents say who does what, but a passive is often the clearer sentence.
write-good.Passive = NO

# A document in a further language, such as README.de.md or docs/faq.nl.md, has no
# style of its own; the spelling check covers the German ones.
[{*.[a-z][a-z].md,*.[a-z][a-z][-_][A-Z][A-Z].md,docs/de/*.md}]
BasedOnStyles =

# Except for one whose ending says that it is in English, such as docs/guide.en.md.
[*.en.md]
BasedOnStyles = write-good, proselint
write-good.Passive = NO
