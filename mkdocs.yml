# The documentation website: MkDocs with the Material theme builds it from the pages
# in docs/, and the Docs workflow publishes it on GitHub Pages with every change of
# main. This file belongs to the project: the blueprint writes it once, and its
# updates leave it as it is. The settings that every website shares come from
# .github/mkdocs-blueprint.yml, which the blueprint keeps current.
# https://squidfunk.github.io/mkdocs-material/
#
# The blueprint's own website: a start page in English and German, the guide, which
# includes the READMEs, and the changelog, and the Dashboard workflow publishes it
# with the dashboard under dashboard/. Preview it while you write, at
# http://127.0.0.1:8000, with the tools of stacks/docs/ in .venv-docs:
#   python3 -m venv .venv-docs
#   .venv-docs/bin/pip install --require-hashes -r stacks/docs/requirements-docs.txt
#   .venv-docs/bin/mkdocs serve
# On Windows, with py -3 for python3 and .venv-docs/Scripts/ for .venv-docs/bin/.
# With these tools, scripts/check.sh builds the website too, as the check docs does.
INHERIT: .github/mkdocs-blueprint.yml
site_name: "Repo Blueprint"
site_description: "A Copier template for GitHub repositories, with tests, releases, security checks and bots built in, for seven kinds of projects."
site_url: https://dennis-otto.github.io/repo-blueprint/
repo_url: https://github.com/Dennis-Otto/repo-blueprint
repo_name: Dennis-Otto/repo-blueprint
copyright: "© 2026 Dennis Otto"
# No pencil to edit a page: the guide and the changelog only include the READMEs and
# CHANGELOG.md.
edit_uri: ""

plugins:
  search:
    lang: [en, de]
  # English and German. A German page sits next to its English one, named like it
  # with .de, such as index.de.md next to index.md, and makes the German website in
  # de/, with a switch between the languages in the header. A page without a German
  # version, such as the roadmap, is shown in English there.
  # https://ultrabug.github.io/mkdocs-static-i18n/
  i18n:
    enabled: true
    languages:
      - locale: en
        name: English
        default: true
        build: true
      - locale: de
        name: Deutsch
        build: true
        site_description: "Eine Copier-Vorlage für GitHub-Repositories, mit Tests, Releases, Sicherheitsprüfungen und Bots, für sieben Arten von Projekten."
        nav_translations:
          Home: Start
          Guide: Anleitung
          Your own account: Dein eigenes Konto
          Security design: Sicherheitsdesign
          Automation: Automatisierung
          Decisions: Entscheidungen
          Changelog: Änderungen

# The hooks of every website, and those of this one: the pictures of the READMEs,
# named from the root of the repository, show on the website too.
hooks:
  - .github/mkdocs_blueprint.py
  - .github/mkdocs_project.py

# The menu, the same in both languages, with the titles of nav_translations above on
# the German website. The hooks write the page of the automation from the workflows.
nav:
  - Home: index.md
  - Guide: guide.md
  - Your own account: own-account.md
  - Roadmap: roadmap.md
  - Security design: security.md
  - Automation: automation.md
  - Decisions: decisions/README.md
  - Changelog: changelog.md
  - Dashboard: https://dennis-otto.github.io/repo-blueprint/dashboard/
