# The documentation website: MkDocs with the Material theme builds it from the pages
# in docs/, and the Docs workflow publishes it on GitHub Pages with every change of
# main. This file belongs to the project: the blueprint writes it once, and its
# updates leave it as it is. Preview the website while you write with
#   pip install --require-hashes -r .github/docs-requirements.txt && mkdocs serve
# https://squidfunk.github.io/mkdocs-material/
#
# The blueprint's own website: its pages include the READMEs and the changelog, and
# the Dashboard workflow publishes it with the dashboard under dashboard/. Preview it
# with the tools of stacks/docs/requirements-docs.txt.
site_name: "Repo Blueprint"
site_description: "A Copier template for GitHub repositories, with tests, releases, security checks and bots built in, for seven kinds of projects."
site_url: https://dennis-otto.github.io/repo-blueprint/
repo_url: https://github.com/Dennis-Otto/repo-blueprint
repo_name: Dennis-Otto/repo-blueprint
copyright: "© 2026 Dennis Otto"
# Every page is a file next to the others, as on GitHub, so that a relative path in
# HTML, such as <img src="images/card.png">, leads to the same file in both places.
use_directory_urls: false

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  # Light or dark, as the reader's system prefers, with a switch in the header.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  # No pencil to edit a page: the pages only include the READMEs and the changelog.
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: [en, de]

# Markdown as GitHub shows it, so that every page reads the same on github.com.
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Anchors as GitHub makes them, so that links to a heading work in both places.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  # A page may include a file of the repository, such as the line
  # --8<-- "CHANGELOG.md", so that nothing is written twice.
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# A link or an anchor that leads nowhere, and a page outside the menu, fail the
# build; not_in_nav names the pages that are outside on purpose.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# The menu. German pages live under docs/de/ and form the section "Deutsch", which
# the language switch of extra.alternate below leads to.
nav:
  - Home: index.md
  - Decisions: decisions/README.md
  - Changelog: changelog.md
  - Dashboard: https://dennis-otto.github.io/repo-blueprint/dashboard/
  - Deutsch:
      - de/index.md

# The decision records are in the menu through their table, decisions/README.md;
# so is a new one, which its pull request adds there.
not_in_nav: |
  /decisions/

extra:
  alternate:
    - name: English
      link: /repo-blueprint/
      lang: en
    - name: Deutsch
      link: /repo-blueprint/de/
      lang: de
