# The documentation website: MkDocs with the Material theme builds it from the pages
# in docs/, and the Docs workflow publishes it on GitHub Pages with every change of
# main. This file belongs to the project: the blueprint writes it once, and its
# updates leave it as it is. The settings that every website shares come from
# .github/mkdocs-blueprint.yml, which the blueprint keeps current.
# https://squidfunk.github.io/mkdocs-material/
#
# The blueprint's own website: a start page in English and German, the guide, which
# includes the READMEs, the comparison, a page for each kind of project, the questions
# and answers, the troubleshooting, the architecture, the reference, which reference.py
# writes from copier.yml and the workflows, and the changelog, and the Dashboard
# workflow publishes it
# with the dashboard under dashboard/. Preview it while you write, at
# http://127.0.0.1:8000, with the tools of stacks/docs/ in .venv-docs:
#   python3 -m venv .venv-docs
#   .venv-docs/bin/pip install --require-hashes -r stacks/docs/requirements-docs.txt
#   .venv-docs/bin/mkdocs serve
# On Windows, with py -3 for python3 and .venv-docs/Scripts/ for .venv-docs/bin/.
# With these tools, scripts/check.sh builds the website too, as the check docs does.
INHERIT: .github/mkdocs-blueprint.yml
site_name: "Repo Blueprint"
site_description: "Copier template for self-maintaining GitHub repos (Python, Home Assistant/HACS, Nextcloud apps, GitHub Actions, Node/TypeScript, containers): CI, signed SLSA L3 releases, Renovate, OpenSSF Scorecard, settings as code, and a bot that rolls out every template update."
site_url: https://dennis-otto.github.io/repo-blueprint/
repo_url: https://github.com/Dennis-Otto/repo-blueprint
repo_name: Dennis-Otto/repo-blueprint
copyright: "© 2026 Dennis Otto"
# No pencil to edit a page: the guide and the changelog only include the READMEs and
# CHANGELOG.md.
edit_uri: ""

plugins:
  search:
    lang: [en, de]
  # English and German. A German page sits next to its English one, named like it
  # with .de, such as index.de.md next to index.md, and makes the German website in
  # de/, with a switch between the languages in the header. A page without a German
  # version, such as the roadmap, is shown in English there.
  # https://ultrabug.github.io/mkdocs-static-i18n/
  i18n:
    enabled: true
    languages:
      - locale: en
        name: English
        default: true
        build: true
      - locale: de
        name: Deutsch
        build: true
        site_description: "Copier-Vorlage für GitHub-Repositorys, die sich selbst pflegen (Python, Home Assistant/HACS, Nextcloud-Apps, GitHub Actions, Node/TypeScript, Container): CI, signierte Releases nach SLSA L3, Renovate, OpenSSF Scorecard, Einstellungen als Code und ein Bot, der jedes Update der Vorlage ausrollt."
        nav_translations:
          Home: Start
          Guide: Anleitung
          Features: Funktionen
          Checks and the PR coach: Prüfungen und der PR-Coach
          Fix bot and self-healing: Fix-Bot und Selbstheilung
          Mutation tests, fuzzing and property tests: Mutationstests, Fuzzing und Property-Tests
          Releases and security: Releases und Sicherheit
          Dependencies and updates: Abhängigkeiten und Updates
          Bots, their cost and the dashboard: Bots, ihre Kosten und das Dashboard
          Website, diagrams and screenshots: Website, Diagramme und Screenshots
          Settings as code: Einstellungen als Code
          Community and development: Community und Entwicklung
          Comparison: Vergleich
          Kinds of projects: Arten von Projekten
          Home Assistant integration: Home-Assistant-Integration
          Nextcloud app: Nextcloud-App
          Python package: Python-Paket
          Node package: Node-Paket
          Container image: Container-Image
          Repository without a build: Repository ohne Build
          Your own account: Dein eigenes Konto
          Questions and answers: Fragen und Antworten
          Troubleshooting: Fehlerbehebung
          Architecture: Architektur
          Reference: Referenz
          Questions of Copier: Fragen von Copier
          Variables and secrets: Variablen und Secrets
          Security design: Sicherheitsdesign
          Automation: Automatisierung
          Decisions: Entscheidungen
          Changelog: Änderungen

# The hooks of every website, and those of this one: the pictures of the READMEs,
# named from the root of the repository, show on the website too.
hooks:
  - .github/mkdocs_blueprint.py
  - .github/mkdocs_project.py

# The menu, the same in both languages, with the titles of nav_translations above on
# the German website. The hooks write the page of the automation from the workflows.
nav:
  - Home: index.md
  - Guide: guide.md
  - Features:
      - Checks and the PR coach: features/checks.md
      - Fix bot and self-healing: features/self-healing.md
      - Mutation tests, fuzzing and property tests: features/tests.md
      - Releases and security: features/releases.md
      - Dependencies and updates: features/updates.md
      - Bots, their cost and the dashboard: features/bots.md
      - Website, diagrams and screenshots: features/website.md
      - Settings as code: features/settings.md
      - Community and development: features/development.md
  - Comparison: compare.md
  - Kinds of projects:
      - Home Assistant integration: kinds/home-assistant.md
      - Nextcloud app: kinds/nextcloud-app.md
      - GitHub Action: kinds/github-action.md
      - Python package: kinds/python-package.md
      - Node package: kinds/node-package.md
      - Container image: kinds/container.md
      - Repository without a build: kinds/generic.md
  - Your own account: own-account.md
  - Questions and answers: faq.md
  - Troubleshooting: troubleshooting.md
  - Architecture: architecture.md
  - Reference:
      - Questions of Copier: reference/questions.md
      - Variables and secrets: reference/variables.md
  - Roadmap: roadmap.md
  - Security design: security.md
  - Automation: automation.md
  - Decisions: decisions/README.md
  - Changelog: changelog.md
  - Dashboard: https://dennis-otto.github.io/repo-blueprint/dashboard/
