# The advisories that OSV-Scanner accepts in requirements-test.txt beside this file, the
# test tools of a Home Assistant integration, which no user installs: OSV-Scanner reads
# the osv-scanner.toml in the folder of each lock file.
#
# The test plugin, pytest-homeassistant, pins Home Assistant, which pins packages such
# as Pillow and uv exactly, so no update of the lock file can fix an advisory of one of
# them until Home Assistant moves on. Such a version gets a [[PackageOverrides]] here,
# which accepts every advisory of that version, with its reason and with
# effectiveUntil, after which OSV-Scanner reports it again and a person looks again.
# `blueprint.py advisories --fix` writes a rule of Renovate for each into
# .github/renovate-accepted.json5, so that Renovate tries no fix that the lock file
# can't take; scripts/check.sh fails while the two disagree. An update of the test
# plugin that moves a version ends its acceptance: delete the entry with it.
# https://github.com/Dennis-Otto/repo-blueprint
