# The advisories that OSV-Scanner accepts in requirements-test.txt beside this file, the
# test tools of a Home Assistant integration, which no user installs: OSV-Scanner reads
# the osv-scanner.toml in the folder of each lock file.
#
# pytest-homeassistant-custom-component pins Home Assistant, which pins Pillow and uv
# exactly, so no update of the lock file can fix their advisories until Home Assistant
# moves on. Each [[PackageOverrides]] accepts every advisory of one version, with its
# reason and with effectiveUntil, after which OSV-Scanner reports it again and a person
# looks again. `blueprint.py advisories --fix` writes a rule of Renovate for each
# into .github/renovate-accepted.json5, so that Renovate tries no fix that the lock file
# can't take; scripts/check.sh fails while the two disagree. An update of the test
# plugin that moves a version ends its acceptance: delete the entry with it.
# https://github.com/Dennis-Otto/repo-blueprint

[[PackageOverrides]]
name = "pillow"
version = "12.3.0"
ecosystem = "PyPI"
vulnerability.ignore = true
effectiveUntil = 2026-11-22
reason = """Home Assistant 2026.10 pins Pillow 12.3.0, which only its test plugin
installs here, for the tests of the integration; the next update of
pytest-homeassistant-custom-component that brings Pillow 13 ends this."""
