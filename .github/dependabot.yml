# Renovate keeps the blueprint current (.github/renovate.json5). Dependabot keeps
# only the Features of the dev containers, because it alone also updates their lock
# files, devcontainer-lock.json: the blueprint's own and those of the projects with
# Node. They reach every repository, so they are fix(deps) and lead to a patch
# release that merges itself once every check passes.
version: 2
updates:
  - package-ecosystem: devcontainers
    directories:
      - /
      - /stacks/devcontainer
    schedule:
      interval: monthly
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    groups:
      dev-container-features:
        patterns:
          - "*"
    commit-message:
      prefix: fix
      include: scope
