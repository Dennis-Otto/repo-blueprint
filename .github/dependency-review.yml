# Rules of the dependency review of pull requests (.github/workflows/dependency-review.yml).
# An advisory that this repository accepts, for example in a dependency that only
# the tests install and that a pinned upstream can't move yet, goes into
# allow-ghsas with its reason.
fail-on-severity: moderate
fail-on-scopes:
  - runtime
  - development
  - unknown
show-patched-versions: true
retry-on-snapshot-warnings: true
allow-ghsas: []

# The licenses a new dependency may have: free licenses that the MIT-0 license of
# the blueprint and the permissive licenses of new projects can carry.
allow-licenses:
  - 0BSD
  - Apache-2.0
  - BlueOak-1.0.0
  - BSD-2-Clause
  - BSD-3-Clause
  - BSL-1.0
  - CC-BY-3.0
  - CC-BY-4.0
  - CC0-1.0
  - ISC
  - LGPL-2.1-only
  - LGPL-2.1-or-later
  - LGPL-3.0-only
  - LGPL-3.0-or-later
  - MIT
  - MIT-CMU
  - MIT-0
  - MPL-2.0
  - OFL-1.1
  - PSF-2.0
  - Python-2.0
  - Unicode-3.0
  - Unicode-DFS-2016
  - Unlicense
  - Zlib
# Test-only dependencies of the platforms in stacks/, which no project ships: the
# public API of Nextcloud and the cloud parts of Home Assistant's test base.
allow-dependencies-licenses:
  # The tools of the blueprint bot: Copier's Jinja filters (GPL-3.0-only) and
  # typing-extensions, whose license the review reads wrongly.
  - pkg:pypi/jinja2-ansible-filters
  - pkg:pypi/typing-extensions
  # The dictionaries of cspell, the spell check of the prose in .github/prose/, which
  # only the checks run: Django's words (WTFPL) and the common misspellings
  # (CC-BY-SA-4.0).
  - pkg:npm/%40cspell/dict-django
  - pkg:npm/%40cspell/dict-en-common-misspellings
  - pkg:composer/nextcloud/ocp
  - pkg:pypi/hass-nabucasa
  - pkg:pypi/snitun
  - pkg:pypi/pyric
  - pkg:pypi/text-unidecode
