name: CI (node)

# Node: the locked packages of package-lock.json and the checks of
# scripts/check.sh, the same ones that run locally. The Node version comes from
# .nvmrc. https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  pull_request:
  # Each week on main as well, so that what no commit changes, such as a new rule of a
  # tool, fails here and repairs itself through the fix bot, not in the next pull
  # request. At the time of Lint, so that one commit of the bot holds what both fix.
  schedule:
    - cron: "30 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same pull request, or for a newer push to main, cancels the run
# still going, which would only tell what the newer one tells; the bot for cancelled
# checks starts the run of the head again when a late run for an older commit
# cancelled it. A run on a schedule or by hand is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

jobs:
  check:
    name: check (node)
    # Not in the blueprint itself; generated repositories don't have this line.
    if: github.repository != 'Dennis-Otto/repo-blueprint'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge of a pull request into main, and its head as the second
          # parent, onto which the fix bot commits.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the locked packages
        run: npm ci --ignore-scripts
      # uv compiles the lock files of pip-compile again for the step Lock files match
      # their sources. A project without one needs it not.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: hashFiles('**/requirements*.txt') != ''
        timeout-minutes: 5
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.6"
      - name: Run the checks
        run: bash scripts/check.sh
      # A Chrome extension: Chrome for Testing loads extension/ as the checks built it,
      # and its service worker has to start (scripts/load-extension.mjs).
      - name: Load the extension in Chrome for Testing
        if: hashFiles('scripts/load-extension.mjs') != ''
        run: |
          # On a line of its own, so that a failed download stops the step.
          chrome="$(bash scripts/chrome-for-testing.sh Stable "$RUNNER_TEMP/chrome-for-testing")"
          node scripts/load-extension.mjs "$chrome"
      # The LCOV report of the test runner of Node, which npm test writes as
      # lcov.info, for the coverage in the report of the PR coach.
      - name: Keep the coverage report
        if: always() && hashFiles('lcov.info') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: lcov.info
          retention-days: 14
      # The fix bot: the commands of autofix in .github/checks.toml fix what they
      # can of what the checks found, on the head of the pull request or on main.
      # After the checks, the bot commits the files that they changed onto a branch
      # of this repository, suggests them on a pull request from a fork, or keeps one
      # pull request with the fixes of main.
      - name: Fix what a command can fix
        id: fix
        # On a pull request, after a push and in the weekly run on main, by its schedule or
        # by hand, as bot health starts a schedule that GitHub missed.
        if: >-
          failure() && (contains(fromJSON('["pull_request", "push", "schedule"]'), github.event_name) ||
          (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch))
        env:
          CHECK: "check (node)"
          EVENT: ${{ github.event_name }}
          # The pull request of the release bot, from its branch of this repository,
          # changes the manifest of the release bot itself.
          RELEASE: >-
            ${{ startsWith(github.head_ref, 'release-please--') &&
            github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # The head of the pull request, onto which the bot commits, not its merge
          # into main.
          if [[ "$EVENT" == pull_request ]]; then
            # main as the pull request found it, the first parent of the merge:
            # where the manifest of the release bot names another version than
            # there, fix version writes none, other than for the release bot.
            if [[ "$RELEASE" != true ]]; then
              FIX_BASE="$(git rev-parse HEAD^1)"
              export FIX_BASE
            fi
            git checkout --quiet --force --detach HEAD^2
          else
            # Only what the commands change is a fix, not what the check left behind.
            git checkout --quiet --force HEAD -- .
          fi
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" fix run "$CHECK" --keep "$RUNNER_TEMP/fixes" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the fixes for the fix bot
        if: failure() && steps.fix.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixes-check
          path: ${{ runner.temp }}/fixes/
          # Fixes of files in .github/ as well.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: "check (node)"
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"
