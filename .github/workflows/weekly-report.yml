name: Weekly report

# The weekly report of the owner's public repositories: every Monday it posts what
# they released, merged and fixed in the week (weekly.py) in the discussions of the
# blueprint. Everything it reports is public anyway, so the job's own token reads it.
# This workflow belongs to the blueprint alone.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  schedule:
    # Not on the full hour, when GitHub has the most schedules to start.
    - cron: "7 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-report
  cancel-in-progress: false

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

jobs:
  report:
    name: weekly report
    if: github.repository == 'Dennis-Otto/repo-blueprint'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      discussions: write
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            github.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            # A wildcard names no host to ask.
            [[ "$host" == '*.'* ]] && continue
            until curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "https://$host/"; do
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $host after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $host, waiting 3 s."
              sleep 3
            done
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the report of the week
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="$(python3 weekly.py --owner "$OWNER" --out "$RUNNER_TEMP/report.md")"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Post it in the discussions
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.report.outputs.title }}
        run: |
          # The variables of the queries are GraphQL's, not the shell's.
          # shellcheck disable=SC2016
          read -r repository category < <(gh api graphql \
            -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { id discussionCategories(first: 50) { nodes { id name } } } }' \
            --jq '.data.repository | "\(.id) \(.discussionCategories.nodes[] | select(.name == "General") | .id)"')
          # shellcheck disable=SC2016
          gh api graphql -F repository="$repository" -F category="$category" -F title="$TITLE" \
            -F body=@"$RUNNER_TEMP/report.md" \
            -f query='mutation($repository: ID!, $category: ID!, $title: String!, $body: String!) { createDiscussion(input: {repositoryId: $repository, categoryId: $category, title: $title, body: $body}) { discussion { url } } }' \
            --jq '.data.createDiscussion.discussion.url'
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."
