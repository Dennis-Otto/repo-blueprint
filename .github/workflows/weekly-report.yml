name: Weekly report

# The weekly report of the owner's public repositories: every Monday it posts what
# they released, merged and fixed in the week (weekly.py) in the discussions of the
# blueprint. Everything it reports is public anyway, so the job's own token reads it.
# This workflow belongs to the blueprint alone.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    name: weekly report
    if: github.repository == 'Dennis-Otto/repo-blueprint'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      discussions: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the report of the week
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="$(python3 weekly.py --owner "$OWNER" --out "$RUNNER_TEMP/report.md")"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Post it in the discussions
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.report.outputs.title }}
        run: |
          # The variables of the queries are GraphQL's, not the shell's.
          # shellcheck disable=SC2016
          read -r repository category < <(gh api graphql \
            -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { id discussionCategories(first: 50) { nodes { id name } } } }' \
            --jq '.data.repository | "\(.id) \(.discussionCategories.nodes[] | select(.name == "General") | .id)"')
          # shellcheck disable=SC2016
          gh api graphql -F repository="$repository" -F category="$category" -F title="$TITLE" \
            -F body=@"$RUNNER_TEMP/report.md" \
            -f query='mutation($repository: ID!, $category: ID!, $title: String!, $body: String!) { createDiscussion(input: {repositoryId: $repository, categoryId: $category, title: $title, body: $body}) { discussion { url } } }' \
            --jq '.data.createDiscussion.discussion.url'
