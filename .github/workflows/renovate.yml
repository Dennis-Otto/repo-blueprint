name: Renovate

# The dependency bot. On its schedule, which GitHub runs as it can, a few times a day
# and often hours late, and on demand, it runs Renovate as the release app of the
# owner: in the blueprint for each repository of its owner that has a
# .github/renovate.json5, and in a repository that runs Renovate itself, the answer
# renovate_runner "self" of the blueprint, for that repository alone. It opens the
# updates of the actions, the dependencies, the images and the pins, and the checks
# of each repository decide whether they merge. The rules of the updates are in the
# .github/renovate.json5 of each repository; .github/renovate-global.json5 holds
# those of the bot itself. A pull request that changes the rules or a lock file
# shows whether Renovate accepts the rules and still reads every file of the
# dependencies.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches: [main]
    paths:
      - .github/renovate-global.json5
      - .github/workflows/renovate.yml
  pull_request:
    paths:
      - .github/renovate*.json5
      - .github/workflows/renovate.yml
      # Renovate compiles each lock file again with the command in its header.
      - "**/requirements*.txt"
      - "**/requirements*.in"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: renovate rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Each pull request checks on its own: it waits neither for the bot nor for the
    # other pull requests, such as the lock files that Renovate updates in one run.
    concurrency:
      group: renovate-rules-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the rules of the repository and of the bot
        env:
          IMAGE: ghcr.io/renovatebot/renovate:44.145.1@sha256:6f1f3e2d9d0c3f99aa1f61f7509d302185de7deb173ac8c5ff88a5ce283ec435
        run: |
          docker run --rm --volume "$PWD:/usr/src/app" --workdir /usr/src/app "$IMAGE" \
            renovate-config-validator --strict .github/renovate.json5 .github/renovate-blueprint.json5
          docker run --rm --volume "$PWD:/usr/src/app" --workdir /usr/src/app \
            --env RENOVATE_CONFIG_FILE=/usr/src/app/.github/renovate-global.json5 "$IMAGE" \
            renovate-config-validator --strict
      - name: Read every file of the dependencies as Renovate does
        env:
          IMAGE: ghcr.io/renovatebot/renovate:44.145.1@sha256:6f1f3e2d9d0c3f99aa1f61f7509d302185de7deb173ac8c5ff88a5ce283ec435
        run: |
          # The validator checks the rules, not the files they apply to. A lock file
          # whose header Renovate can't read only costs a warning in each of its runs,
          # and the file gets no update from then on, not even one that fixes a
          # vulnerability. So Renovate reads the committed files here, as in its runs
          # but without a token and without looking anything up. The platform "local"
          # has no presets: the rules of the blueprint come in as those of the bot.
          git archive --output="$RUNNER_TEMP/repository.tar" HEAD
          # Renovate ends with exit code 1 after an error in its log; the log says which.
          status=0
          docker run --rm --volume "$RUNNER_TEMP/repository.tar:/tmp/repository.tar:ro" \
            --env LOG_LEVEL=info --env LOG_FORMAT=json --env RENOVATE_GITHUB_TOKEN_WARN=false \
            --env RENOVATE_CONFIG_FILE=/tmp/repository/.github/renovate-blueprint.json5 "$IMAGE" \
            bash -c '
              mkdir /tmp/repository && cd /tmp/repository && tar -xf /tmp/repository.tar
              sed -i "s#\"local>[^\"]*\"##" .github/renovate.json5
              renovate --platform=local --dry-run=extract' > "$RUNNER_TEMP/extract.json" || status=$?
          # The lock files of pip-compile, as managerFilePatterns finds them.
          git ls-files | grep -E '(^|/)requirements[^/]*\.txt$' > "$RUNNER_TEMP/lock-files" || true
          python3 - "$RUNNER_TEMP/extract.json" "$RUNNER_TEMP/lock-files" "$status" <<'PYTHON'
          import json
          import os
          import sys

          log, lock_files, status = sys.argv[1], sys.argv[2], int(sys.argv[3])
          with open(lock_files, encoding="utf-8") as names:
              expected = set(names.read().split())
          # What every line of the log has, besides its message and its details.
          common = {"name", "hostname", "pid", "level", "logContext", "repository", "time", "v"}
          problems, read = [], None
          with open(log, encoding="utf-8") as lines:
              for line in lines:
                  try:
                      entry = json.loads(line)
                  except ValueError:
                      print(line, end="")
                      continue
                  message = entry.pop("msg", "")
                  if entry.get("level", 0) >= 40:
                      details = {key: value for key, value in entry.items() if key not in common}
                      problems.append(f"{message}: {json.dumps(details)}")
                  elif message == "Extracted dependencies":
                      # One package file per source of pip-compile, with its lock files.
                      packages = entry["packageFiles"].get("pip-compile", [])
                      read = {name for package in packages for name in package.get("lockFiles", [])}
          if read is None:
              problems.append("Renovate didn't finish reading the files.")
          else:
              problems += [f"Renovate doesn't read the lock file {name}." for name in sorted(expected - read)]
          if status:
              problems.append(f"Renovate ended with exit code {status}.")
          for problem in problems:
              print(f"::error title=Renovate::{problem}")
          if problems:
              sys.exit(1)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Renovate reads every file, the {len(expected)} lock files of pip-compile among them.\n")
          PYTHON

  renovate:
    name: renovate
    # In the blueprint, for the repositories of its owner; a repository that runs
    # Renovate itself gets the job without the name of the blueprint.
    if: github.event_name != 'pull_request' && github.repository == 'Dennis-Otto/repo-blueprint'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # One run of the bot at a time; the next one waits for it.
    concurrency:
      group: renovate
      cancel-in-progress: false
    # The environment holds the private key of the release app; only main may use it.
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
      # The one issue with the warnings and errors of Renovate.
      issues: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Renovate runs as the release app of the owner, whose token may change the
      # workflows and starts the checks of its pull requests. Without it, the run says
      # what to set up rather than fail at the token.
      - name: Check that the release app is set up
        env:
          CLIENT_ID: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          KEY_SET: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY != '' }}
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            missing="names no release app in the variable RELEASE_AUTOMATION_CLIENT_ID"
          elif [[ "$KEY_SET" != true ]]; then
            missing="has no private key of its release app in the secret RELEASE_AUTOMATION_PRIVATE_KEY of the environment release"
          else
            exit 0
          fi
          echo "::error::This repository $missing, which Renovate runs as; no dependency was updated."
          {
            echo "### Renovate needs the release app of the owner"
            echo
            echo "This repository $missing. Renovate runs as the release app of the owner, a GitHub App whose token may change the workflows that an update touches and starts the checks of its pull requests, which the token of a job can't. No dependency was updated."
            echo
            echo "\`python3 .github/blueprint.py checklist\` shows the steps: a link that registers the app with its permissions filled in, the update of the answers of the blueprint that names it in \`.github/repository.toml\`, the settings and its private key. The next run updates the dependencies."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Create a token of the release app
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          # In the blueprint, every repository of the installation, on purpose: the
          # app is installed on exactly the repositories that Renovate keeps current.
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          # Only what updates need, and no administration: the package managers
          # that write the lock files can't change a setting with it.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-issues: write
          permission-statuses: write
          permission-checks: read
          permission-vulnerability-alerts: read
      # Renovate commits and comments as the bot user of the app, and knows its own
      # commits by their author, whose number GitHub gave the bot user.
      - name: Name the bot user of the release app
        id: bot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          user="${SLUG}[bot]"
          id=$(gh api "users/$SLUG%5Bbot%5D" --jq .id)
          {
            echo "username=$user"
            echo "git-author=$user <$id+$user@users.noreply.github.com>"
          } >> "$GITHUB_OUTPUT"
      - name: Run Renovate
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ steps.app.outputs.token }}
          configurationFile: .github/renovate-global.json5
          # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
          renovate-version: 44.145.1@sha256:6f1f3e2d9d0c3f99aa1f61f7509d302185de7deb173ac8c5ff88a5ce283ec435
        env:
          LOG_LEVEL: info
          RENOVATE_USERNAME: ${{ steps.bot.outputs.username }}
          RENOVATE_GIT_AUTHOR: ${{ steps.bot.outputs.git-author }}
          # In the blueprint, every repository of the owner on which the app is
          # installed and that has a .github/renovate.json5.
          RENOVATE_AUTODISCOVER: "true"
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository_owner }}/*
          # The warnings and errors once more, in JSON, for the next step; the action
          # shares /tmp with the container of Renovate.
          RENOVATE_LOG_FILE: /tmp/renovate/problems.json
          RENOVATE_LOG_FILE_LEVEL: warn
      # A warning, such as a lock file that Renovate can't read, ends no run with a
      # failure, and the bot then skips that file in every run: one issue lists them
      # and closes after three runs in a row without a problem.
      - name: Keep the issue of Renovate's problems current
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          # Repositories have the copy that the blueprint keeps current; the blueprint
          # has the original.
          script=.github/blueprint.py
          if [[ ! -f "$script" ]]; then
            script=blueprint.py
          fi
          python3 "$script" --repo "$GITHUB_REPOSITORY" bot-health renovate /tmp/renovate/problems.json --run "$RUN_URL" |
            tee -a "$GITHUB_STEP_SUMMARY"
