name: CI (php)

# PHP: Composer's locked tools and the checks of scripts/check.sh, the same ones
# that run locally. https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (php)
    # Not in the blueprint itself; generated repositories don't have this line.
    if: github.repository != 'Dennis-Otto/repo-blueprint'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the PHP of composer.json
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.2"
          extensions: dom, libxml, mbstring, xml
          coverage: none
          tools: composer:v2
      - name: Install the locked tools
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run the checks
        run: bash scripts/check.sh
