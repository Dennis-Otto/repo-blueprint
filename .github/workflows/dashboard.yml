name: Dashboard

# The website of the blueprint on GitHub Pages: its documentation, which MkDocs builds
# from mkdocs.yml and docs/ as in every repository, and under dashboard/ the
# dashboard of the owner's public repositories: the release of the blueprint each one
# is on, its releases, its open pull requests, the last runs of its main workflows and
# its OpenSSF Scorecard (dashboard.py), and beside it the same data as repos.json, the
# health of each day as history.json and the releases of every repository as the
# Atom feed releases.atom, at addresses that stay, and the public repositories of
# other owners made with the blueprint, which GitHub's code search finds once a week,
# as made-with.json. On a schedule, which GitHub keeps as it can,
# and after every change of either, of the changelog that a page includes and of the
# code that reads GitHub. A history or a list of the published dashboard that can't
# be read fails the build, so that the website keeps its trends until the next run
# instead of a history of one day; a search that GitHub refuses keeps the list as it
# was. Everything it shows is public anyway, so the job's own token reads it. This workflow belongs to the blueprint alone; the Docs workflow checks the
# documentation in every pull request and publishes the website of every other
# repository.

on:
  push:
    branches: [main]
    paths:
      - dashboard.py
      - blueprint/github.py
      - blueprint/coverage_comment.py
      - blueprint/coach.py
      - .github/workflows/dashboard.yml
      - mkdocs.yml
      - .github/mkdocs-blueprint.yml
      - .github/mkdocs_blueprint.py
      - .github/mkdocs-blueprint.css
      - .github/mkdocs-blueprint.js
      - .github/mkdocs_project.py
      - .github/a11y/**
      - docs/**
      # The pages of the documentation include them.
      - README.md
      - README.de.md
      - CHANGELOG.md
      # The changelog page shows the waiting fragments with this code.
      - changelog.d/**
      - blueprint/changelog.py
      - stacks/docs/requirements-docs.txt
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dashboard
  cancel-in-progress: true

env:
  # The GitHub CLI of the jobs sends no telemetry to GitHub.
  GH_TELEMETRY: "false"
  # The Material theme warns about MkDocs 2.0 in every run; it keeps MkDocs below 2.0
  # itself, so the warning says nothing about this website.
  NO_MKDOCS_2_WARNING: "true"

jobs:
  build:
    name: build the website
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.promises.outputs.languages }}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The date of the last change of every page comes from the history.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        timeout-minutes: 5
        with:
          python-version-file: .python-version
      # uv installs the hash-pinned tools in seconds and checks the hash of each
      # package. Its cache keeps only the wheels that it built from source, under a
      # key of the lock file: pre-built ones download faster than a cache restores
      # them.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        timeout-minutes: 5
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.6"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: stacks/docs/requirements-docs.txt
      - name: Install the hash-pinned tools of the website
        timeout-minutes: 5
        run: uv pip install --system --require-hashes -r stacks/docs/requirements-docs.txt
      - name: Build the documentation
        timeout-minutes: 5
        run: mkdocs build --strict
      # What the hooks of the website promise, as the check docs checks it, and the
      # further languages, whose home pages the job website asks for.
      - name: Check what the hooks of the website promise
        id: promises
        timeout-minutes: 5
        run: python3 blueprint.py site-check site --output "$GITHUB_OUTPUT"
      # Some 4 minutes on a run of its own; the weekly search may wait up to 90 s more
      # for GitHub's limit of the code search, and checks every repository it finds.
      - name: Collect the state of every repository
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 dashboard.py --owner "$OWNER" --out site/dashboard/index.html \
            --history https://dennis-otto.github.io/repo-blueprint/dashboard/history.json \
            --made-with https://dennis-otto.github.io/repo-blueprint/dashboard/made-with.json
      # The accessibility of the dashboard, as the check docs checks the pages of the
      # website, which it keeps accessible: it reports in the summary and as
      # annotations, and the website is published all the same.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 24
      - name: Check the accessibility of the dashboard
        continue-on-error: true
        timeout-minutes: 5
        env:
          REPORT_ONLY: "true"
        run: |
          npm ci --prefix .github/a11y --ignore-scripts --no-audit --no-fund
          node .github/a11y/check.mjs site dashboard/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: publish the website
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # The address of the website, which the job website asks.
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      attestations: write # keeps the signed provenance of the website
      id-token: write # proves to GitHub Pages and to Sigstore which workflow publishes
      pages: write # publishes the website
    steps:
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            *.actions.githubusercontent.com:443
      - name: Make sure that Harden-Runner blocks
        id: blocks
        # Harden-Runner goes on without its agent when the agent can't be downloaded, as
        # in GitHub's outage of 8 November 2026, or doesn't start: the job would reach
        # every host. It stops here instead, so that it can run again (decision 0134).
        timeout-minutes: 1
        run: |
          # The agent writes Initialized into its status once its firewall stands, and
          # runs as the service agent until the end of the job; one that is there may
          # still be starting.
          for _ in {1..30}; do
            [[ -e /home/agent/agent.status || ! -e /home/agent/agent ]] && break
            sleep 1
          done
          status="$(cat /home/agent/agent.status 2>/dev/null || true)"
          if [[ ! -d /home/agent/ ]]; then
            # Harden-Runner returns before it makes the folder of the agent when
            # StepSecurity says that it is unavailable, or the repository skips it.
            why="didn't install its agent, as StepSecurity said that it is unavailable or the repository skips it (the log of its step says which),"
          elif [[ ! -e /home/agent/agent ]]; then
            why="couldn't download its agent, mostly in an outage of GitHub (https://www.githubstatus.com),"
          elif [[ "$status" != Initialized ]]; then
            why="has an agent that didn't start,"
          elif ! systemctl is-active --quiet agent; then
            why="has an agent that stopped,"
          else
            echo "Harden-Runner blocks every host that the job doesn't name."
            exit 0
          fi
          echo "The status of the agent: ${status:-none}"
          echo "::error title=Harden-Runner doesn't block::Harden-Runner $why so this job would reach every host, and it stops here instead. That is no problem of the change: run the job again."
          exit 1
      - name: Wait until Harden-Runner lets the hosts through
        # The runner may have asked for an address past Harden-Runner, which then blocks
        # that address for as long as systemd-resolved keeps it, up to a minute.
        timeout-minutes: 4
        env:
          HOSTS: >-
            api.github.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            *.actions.githubusercontent.com:443
        run: |
          deadline=$(($(date +%s) + 120))
          for endpoint in $HOSTS; do
            host="${endpoint%:*}"
            port="${endpoint##*:}"
            # A wildcard names no host to ask, and a job may leave out a host that keeps it
            # waiting although none of its steps needs it at once.
            [[ "$host" == '*.'* || " $SKIP_WAIT " == *" $endpoint "* ]] && continue
            # Each host on its own port, by HTTP on 80 and by HTTPS on any other. Only a host
            # that curl can't resolve, or can't reach in time, is blocked: one that answers at
            # all, in whatever protocol, is through.
            scheme=https
            [[ "$port" == 80 ]] && scheme=http
            while true; do
              status=0
              curl --silent --head --connect-timeout 3 --max-time 5 --output /dev/null "$scheme://$host:$port/" || status=$?
              case "$status" in
                6 | 7 | 28) ;;
                *) break ;;
              esac
              if (($(date +%s) >= deadline)); then
                echo "::warning::Harden-Runner still blocks $endpoint after two minutes; a step that needs it will fail, and the job can run again."
                break
              fi
              echo "Harden-Runner still blocks $endpoint, waiting 3 s."
              sleep 3
            done
          done
      - name: Publish the website on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # The provenance of what GitHub Pages publishes, artifact.tar of the artifact
      # github-pages, signed with Sigstore for this workflow and its commit, as the
      # release workflow signs every release. This job signs it, not the job build,
      # which needs no id-token. SECURITY.md shows how gh attestation verify checks
      # it.
      - name: Take the website that GitHub Pages publishes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - name: Attest the provenance of the website
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        timeout-minutes: 5
        with:
          subject-path: ${{ runner.temp }}/pages/artifact.tar
      - name: Wait until Harden-Runner has removed Docker
        # Harden-Runner removes Docker with apt-get in the background; a job that ends
        # before it finishes hangs in "Cleaning up orphan processes" until its timeout.
        if: always()
        run: |
          for _ in {1..120}; do
            pgrep -x 'apt-get|dpkg' >/dev/null || exit 0
            sleep 1
          done
          echo "::warning::Harden-Runner still removes Docker after two minutes; the job may hang until its timeout."

  # The published website, asked by a job of its own: the job that publishes holds
  # the tokens for GitHub Pages and Sigstore and reaches only their hosts, while this
  # one reaches the domain of the website, which may be the repository's own, and
  # holds no token at all.
  website:
    name: ask the published website
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # The published website answers: the home page of every language with a page,
      # and an address that leads nowhere with the status 404. The servers of GitHub
      # Pages may take a moment after the deployment, so each request is tried again
      # for about a minute.
      - name: Ask the published website for its pages
        timeout-minutes: 5
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          LANGUAGES: ${{ needs.build.outputs.languages }}
        run: |
          home="${PAGE_URL%/}/"
          page="$RUNNER_TEMP/page.html"
          failed=0
          for language in "" $LANGUAGES; do
            [[ "$language" =~ ^[A-Za-z0-9_-]*$ ]] || continue
            address="$home${language:+$language/}"
            if curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 10 \
              --connect-timeout 10 --max-time 30 --output "$page" "$address" &&
              grep -qF '<title>' "$page"; then
              echo "- $address answers with its page." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=The published website::$address answers with no page: GitHub Pages doesn't serve the website that this run published."
              failed=1
            fi
          done
          # The status that it asks for is an error, so curl tries again only after
          # an error of the server or of the network.
          missing="${home}no-such-page-$GITHUB_SHA"
          status="$(curl --silent --retry 5 --retry-delay 10 --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' "$missing" || true)"
          if [[ "$status" == 404 ]]; then
            echo "- $missing answers with 404, as an address that leads nowhere does." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=The published website::$missing answers with the status $status, not 404: GitHub Pages must answer an address that leads nowhere with its 404 page."
            failed=1
          fi
          exit "$failed"
      # The dashboard and its data, at the addresses that stay, which the owner's
      # website and feed readers read: each file answers, with what it holds.
      - name: Ask the published dashboard for its data
        timeout-minutes: 5
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          dashboard="${PAGE_URL%/}/dashboard"
          found="$RUNNER_TEMP/dashboard"
          failed=0
          for file in index.html history.json repos.json releases.atom made-with.json; do
            case "$file" in
              index.html) holds='<title>' ;;
              history.json) holds='"date"' ;;
              repos.json | made-with.json) holds='"repos"' ;;
              *) holds='<feed' ;;
            esac
            address="$dashboard/$file"
            if curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 10 \
              --connect-timeout 10 --max-time 30 --output "$found" "$address" &&
              grep -qF "$holds" "$found"; then
              echo "- $address answers with its data." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=The published dashboard::$address answers without its data: the owner's website and every feed reader read it at this address."
              failed=1
            fi
          done
          exit "$failed"
