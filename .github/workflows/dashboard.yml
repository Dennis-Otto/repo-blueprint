name: Dashboard

# The dashboard of the owner's public repositories on GitHub Pages: the release of
# the blueprint each one is on, its releases, its open pull requests, the last runs
# of its main workflows and its OpenSSF Scorecard (dashboard.py). Every six hours and
# after every change of the dashboard. Everything it shows is public anyway, so the
# job's own token reads it. This workflow belongs to the blueprint alone.

on:
  push:
    branches: [main]
    paths:
      - dashboard.py
      - .github/workflows/dashboard.yml
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  build:
    name: build the dashboard
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect the state of every repository
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: python3 dashboard.py --owner "$OWNER" --out site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: publish the dashboard
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Publish the page on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
