name: Newest Python

# The checks of scripts/check.sh with the newest Python, beta included, which warns
# early of what the next Python of the runners breaks: after every change of main and
# every week. Not in pull requests: a new Python breaks main and every pull request
# alike, and no pull request waits for this check. A workflow of its own, so that its
# warning leaves the CI of main green, whose coverage the coverage bot compares every
# pull request with. https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  schedule:
    - cron: "25 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

# A newer commit of main makes the run for an older one moot.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  newest-python:
    name: check (newest Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          allow-prereleases: true
      - name: Install the hash-pinned tools
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Run the checks
        run: bash scripts/check.sh
