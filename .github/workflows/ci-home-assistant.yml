name: CI (home-assistant)

# Home Assistant integration: the hash-pinned test tools of requirements-test.txt and
# the checks of scripts/check.sh, plus the validation of HACS and of hassfest and the
# integration on the oldest Home Assistant that its hacs.json names.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # HACS and hassfest apply new rules without a release of this repository, and what
    # no commit changes fails here and repairs itself through the fix bot, not in the
    # next pull request. At the time of Lint, so that one commit of the bot holds what
    # both fix.
    - cron: "30 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same pull request, or for a newer push to main, cancels the run
# still going, which would only tell what the newer one tells; the bot for cancelled
# checks starts the run of the head again when a late run for an older commit
# cancelled it. A run on a schedule or by hand is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

jobs:
  check:
    name: check (home-assistant)
    # Not in the blueprint itself; generated repositories don't have this line.
    if: github.repository != 'Dennis-Otto/repo-blueprint'
    runs-on: ubuntu-24.04
    # A few times its longest run, so that a run that hangs ends early; a step that
    # installs, builds or downloads ends after five minutes.
    timeout-minutes: 15
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge of a pull request into main, and its head as the second
          # parent, onto which the fix bot commits.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        timeout-minutes: 5
        with:
          python-version-file: .python-version
      # uv installs Home Assistant and the hash-pinned test tools in seconds and
      # checks the hash of each package. Its cache keeps only the wheels that it built
      # from source, under a key of the lock file: pre-built ones download faster
      # than a cache restores them.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        timeout-minutes: 5
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.6"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: requirements-test.txt
      - name: Install the hash-pinned test tools
        timeout-minutes: 5
        run: uv pip install --system --require-hashes -r requirements-test.txt
      # mypy starts from what it knew of the code at the last run that passed, and
      # checks again what changed and what depends on it. It keeps no module with an
      # error, so the cache hides no finding.
      - name: Restore the cache of mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}-${{ hashFiles('**/*.py') }}
          restore-keys: mypy-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}-
      # The frontend of the integration, such as its cards, if it has one; its tests
      # belong in scripts/check-project.sh.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('package.json') != ''
        timeout-minutes: 5
        with:
          node-version: 24
          cache: npm
      - name: Install the locked packages of the frontend
        if: hashFiles('package.json') != ''
        timeout-minutes: 5
        run: npm ci --ignore-scripts
      - name: Run the checks
        run: bash scripts/check.sh
      - name: Show the coverage
        if: always() && hashFiles('.coverage') != ''
        run: |
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage xml -o "$RUNNER_TEMP/coverage.xml"
      - name: Keep the coverage report
        if: always() && hashFiles('.coverage') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage.xml
          retention-days: 14
      # The fix bot: the commands of autofix in .github/checks.toml fix what they
      # can of what the checks found, on the head of the pull request or on main.
      # After the checks, the bot commits the files that they changed onto a branch
      # of this repository, suggests them on a pull request from a fork, or keeps one
      # pull request with the fixes of main.
      - name: Fix what a command can fix
        id: fix
        # On a pull request, after a push and in the weekly run on main, by its schedule or
        # by hand, as bot health starts a schedule that GitHub missed.
        if: >-
          failure() && (contains(fromJSON('["pull_request", "push", "schedule"]'), github.event_name) ||
          (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch))
        env:
          CHECK: "check (home-assistant)"
          EVENT: ${{ github.event_name }}
          # The pull request of the release bot, from its branch of this repository,
          # changes the manifest of the release bot itself.
          RELEASE: >-
            ${{ startsWith(github.head_ref, 'release-please--') &&
            github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # The head of the pull request, onto which the bot commits, not its merge
          # into main.
          if [[ "$EVENT" == pull_request ]]; then
            # main as the pull request found it, the first parent of the merge:
            # where the manifest of the release bot names another version than
            # there, fix version writes none, other than for the release bot.
            if [[ "$RELEASE" != true ]]; then
              FIX_BASE="$(git rev-parse HEAD^1)"
              export FIX_BASE
            fi
            git checkout --quiet --force --detach HEAD^2
          else
            # Only what the commands change is a fix, not what the check left behind.
            git checkout --quiet --force HEAD -- .
          fi
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" fix run "$CHECK" --keep "$RUNNER_TEMP/fixes" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the fixes for the fix bot
        if: failure() && steps.fix.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixes-check
          path: ${{ runner.temp }}/fixes/
          # Fixes of files in .github/ as well.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: "check (home-assistant)"
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"

  # HACS, hassfest and the oldest Home Assistant in one job, which takes one runner
  # instead of three; each step runs also when one before failed, so that the check
  # reports all of them, and the PR coach explains each one that failed.
  home-assistant:
    name: home-assistant
    # Not in the blueprint itself; generated repositories don't have this line.
    if: github.repository != 'Dennis-Otto/repo-blueprint'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      # HACS' moving ghcr.io/hacs/action:main image on purpose: it always validates
      # against the rules HACS applies to new submissions today. The step runs it as
      # the action hacs/action does, with the inputs as INPUT_ variables and the event
      # as a file, but without the action itself: a pin to a commit of its branch
      # falls behind with every commit there, which zizmor reports. The image reads
      # the repository through the API, at the branch of the event.
      - name: Validate the HACS metadata
        id: hacs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          INPUT_CATEGORY: integration
          INPUT_COMMENT: "false"
          INPUT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --env INPUT_CATEGORY --env INPUT_COMMENT --env INPUT_GITHUB_TOKEN \
            --env GITHUB_REPOSITORY --env GITHUB_EVENT_PATH=/github/workflow/event.json \
            --volume "$GITHUB_EVENT_PATH:/github/workflow/event.json:ro" \
            ghcr.io/hacs/action:main
      # hassfest runs Home Assistant's current image, for the same reasons and as its
      # action home-assistant/actions/hassfest does, with the problem matcher of the
      # action, which shows each error and warning as an annotation.
      - name: Validate the integration
        id: hassfest
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          cat > "$RUNNER_TEMP/hassfest.json" <<'EOF'
          {"problemMatcher": [{"owner": "hassfest", "pattern": [{"regexp": "^\\*\\s\\[(ERROR|WARNING)\\]\\s(.*)$", "severity": 1, "message": 2}]}]}
          EOF
          echo "::add-matcher::$RUNNER_TEMP/hassfest.json"
          docker run --rm --volume "$PWD:/github/workspace:ro" ghcr.io/home-assistant/hassfest:latest
      # HACS offers a release to every Home Assistant from the minimum of hacs.json on,
      # but the tests run on the Home Assistant of the lock file, which Renovate moves on
      # every month. This step imports every module of each integration in the image of
      # that oldest Home Assistant, with its Python and its packages, after it installed
      # the requirements of the manifest as Home Assistant does, so that code which needs
      # a newer Home Assistant fails here and not for its users. hacs.json alone names
      # the minimum, and the image of that release is what its users run.
      - name: Load the integration on the oldest Home Assistant
        id: oldest
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          if [[ ! -f hacs.json ]]; then
            echo "There is no hacs.json to name the oldest Home Assistant; nothing to load."
            exit 0
          fi
          minimum="$(jq -r '.homeassistant // ""' hacs.json)"
          if [[ -z "$minimum" ]]; then
            echo "hacs.json names no oldest Home Assistant, so HACS offers each release to every one; nothing to load."
            exit 0
          fi
          if [[ ! "$minimum" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]]; then
            echo "::error file=hacs.json,title=No release of Home Assistant::hacs.json names $minimum as the oldest Home Assistant, which is no release such as 2026.8.0."
            exit 1
          fi
          echo "Loading the integration on Home Assistant $minimum, the oldest that hacs.json promises."
          docker run --rm --interactive --volume "$PWD:/github/workspace:ro" --workdir /github/workspace \
            --entrypoint python3 "ghcr.io/home-assistant/home-assistant:$minimum" - <<'EOF'
          """Imports every module of each integration in custom_components/."""
          import importlib
          import json
          import sys
          import traceback
          from importlib.metadata import version
          from pathlib import Path

          print(f"Home Assistant {version('homeassistant')} on Python {sys.version.split()[0]}")
          sys.path.insert(0, str(Path.cwd()))
          failed = 0
          for manifest in sorted(Path("custom_components").glob("*/manifest.json")):
              requirements = json.loads(manifest.read_text(encoding="utf-8")).get("requirements") or []
              if requirements:
                  import homeassistant
                  from homeassistant.util.package import install_package

                  constraints = Path(homeassistant.__file__).parent / "package_constraints.txt"
                  for requirement in requirements:
                      if not install_package(requirement, upgrade=False, constraints=str(constraints)):
                          failed += 1
                          print(f"::error file={manifest.as_posix()},title=A requirement that doesn't install::{requirement} doesn't install on the oldest Home Assistant.")
              for path in sorted(manifest.parent.rglob("*.py")):
                  parts = path.with_suffix("").parts
                  module = ".".join(parts[:-1] if parts[-1] == "__init__" else parts)
                  try:
                      importlib.import_module(module)
                  except BaseException as error:
                      failed += 1
                      traceback.print_exc()
                      reason = " ".join(traceback.format_exception_only(error)[-1].split())
                      print(f"::error file={path.as_posix()},title=Not on the oldest Home Assistant::{module} doesn't import: {reason}")
                  else:
                      print(f"{module} imports.")
          sys.exit(1 if failed else 0)
          EOF
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml: each check
      # of the job that failed, or the job itself when none of them did.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: home-assistant
          FAILED: |
            ${{ steps.hacs.outcome == 'failure' && 'hacs' || '' }}
            ${{ steps.hassfest.outcome == 'failure' && 'hassfest' || '' }}
            ${{ steps.oldest.outcome == 'failure' && 'oldest-home-assistant' || '' }}
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          mapfile -t parts < <(grep . <<<"$FAILED" || true)
          python3 "$script" coach explain "$CHECK" --parts "${parts[@]}"
