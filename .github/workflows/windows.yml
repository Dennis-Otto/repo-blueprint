name: Windows

# The checks of scripts/check.sh on Windows, in Git Bash, as a contributor on Windows
# runs them before a push; the other workflows run on Linux only. Every week, and for
# a pull request that changes the code, the tests or what they run with. Not a
# required check. This workflow belongs to the blueprint alone.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  pull_request:
    paths:
      - "**.py"
      - "blueprint/**"
      - "tests/**"
      - pyproject.toml
      - requirements-dev.txt
      - .python-version
      - .gitattributes
      - scripts/check.sh
      - .github/workflows/windows.yml
  schedule:
    - cron: "20 3 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Git Bash, as on the machine of a contributor: its PATH finds its own bash before
    # the launcher of WSL in System32, which the runner has as well.
    shell: bash

jobs:
  check:
    name: check (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the hash-pinned tools
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Run the checks
        run: bash scripts/check.sh
