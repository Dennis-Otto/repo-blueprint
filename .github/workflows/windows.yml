name: Windows

# The checks of scripts/check.sh on Windows, in Git Bash, as a contributor on Windows
# runs them before a push; the other workflows run on Linux only. Every week, and for
# a pull request or a push to main that changes the code, the tests, the template they
# render (whose paths must be valid on Windows too) or what they run with. Not a
# required check, so a pull request can merge before it ends: a red run on main is the
# one that the daily look of the bot-health bot opens an issue for, as this is the only
# full run on the oldest Python.
# This workflow belongs to the blueprint alone.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  pull_request:
    paths:
      - "**.py"
      - "blueprint/**"
      - "tests/**"
      - "template/**"
      - "includes/**"
      - copier.yml
      - pyproject.toml
      - requirements-dev.txt
      - .gitattributes
      - scripts/check.sh
      - scripts/diagrams.sh
      - .github/workflows/windows.yml
  push:
    branches: [main]
    paths:
      - "**.py"
      - "blueprint/**"
      - "tests/**"
      - "template/**"
      - "includes/**"
      - copier.yml
      - pyproject.toml
      - requirements-dev.txt
      - .gitattributes
      - scripts/check.sh
      - scripts/diagrams.sh
      - .github/workflows/windows.yml
  schedule:
    - cron: "20 3 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

defaults:
  run:
    # Git Bash, as on the machine of a contributor: its PATH finds its own bash before
    # the launcher of WSL in System32, which the runner has as well.
    shell: bash

# The GitHub CLI of the jobs sends no telemetry to GitHub.
env:
  GH_TELEMETRY: "false"

jobs:
  check:
    name: check (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The oldest Python that the tool of every repository runs with, as the Python of
      # the runner: .python-version of the blueprint is the newest one, on which coverage
      # measures faster, so this check is the one that runs the tests with the oldest.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the hash-pinned tools
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Run the checks
        run: bash scripts/check.sh
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: "check (Windows)"
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python "$script" coach explain "$CHECK"
