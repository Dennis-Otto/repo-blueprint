name: CI (container)

# Container image: Hadolint and the checks of scripts/check.sh, which build the
# image and run its self-test, the same ones that run locally.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (container)
    # Not in the blueprint itself; generated repositories don't have this line.
    if: github.repository != 'Dennis-Otto/repo-blueprint'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Hadolint in its image, by tag and digest, which Renovate keeps current, with
      # the rules of the project's .hadolint.yaml where it has one. Its action would
      # build an image of its own at the start of the job. The problem matcher of the
      # action shows each finding as an annotation.
      - name: Lint the Dockerfile
        timeout-minutes: 5
        run: |
          cat > "$RUNNER_TEMP/hadolint.json" <<'EOF'
          {"problemMatcher": [{"owner": "hadolint", "pattern": [{"regexp": "^(.+):(\\d+)\\s(\\S+)\\s(error|warning|info|style):\\s(.+)$", "file": 1, "line": 2, "code": 3, "severity": 4, "message": 5}]}]}
          EOF
          echo "::add-matcher::$RUNNER_TEMP/hadolint.json"
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo \
            ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint --no-color Dockerfile
      - name: Build the image and run its self-test
        run: bash scripts/check.sh
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: "check (container)"
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"
