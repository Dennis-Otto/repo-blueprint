name: Settings

# The settings bot. Every week, and after each change of the settings as code or of its
# own code, it brings the settings of the repository on GitHub in line with
# .github/repository.toml, .github/repository.project.toml and .github/labels.toml, as
# the release app, with a token that may write the administration of the repository but
# neither its code nor its workflows. What the API can't set, such as the value of a
# secret, and what GitHub refused fail the run and show in its summary, with the command
# that sets it or the permission that the app lacks.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
    # Not .github/labels.toml: the Labels workflow applies a change of the labels, and
    # two workflows that create the same label at once would fail one of them.
    paths:
      - .github/repository.toml
      - .github/repository.project.toml
      # Every workflow and action: one that runs a new action, also in turn, gets the
      # check of the allowed actions with its merge, not a week later.
      - .github/workflows/**
      - .github/actions/**
      - action.yml
      - action.yaml
      # Its code, so that an update of the blueprint that changes how a setting is
      # applied takes effect with its merge: in a repository the copy of the blueprint,
      # in the blueprint the modules that settings apply runs.
      - .github/blueprint.py
      - .github/blueprint/**
      - blueprint.py
      - blueprint/__init__.py
      - blueprint/cli.py
      - blueprint/github.py
      - blueprint/settings.py
  schedule:
    - cron: "5 6 * * 4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: settings
  cancel-in-progress: true

jobs:
  check:
    name: settings
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment holds the private key of the release app; only main may use it.
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Without the release app of the owner, the run names what is missing rather than
      # fail at the token; every workflow has this step, the same but for its variables.
      - name: Check that the release app is set up
        id: release-app
        env:
          CLIENT_ID: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          KEY_SET: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY != '' }}
          # Who needs the app and for what, what happens without it, and whether the
          # run fails then.
          BOT: the settings bot
          TASK: apply the settings as code
          WITHOUT: no setting has changed
          REQUIRED: "true"
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            missing="names no release app in the variable RELEASE_AUTOMATION_CLIENT_ID"
          elif [[ "$KEY_SET" != true ]]; then
            missing="has no private key of its release app in the secret RELEASE_AUTOMATION_PRIVATE_KEY of the environment release"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          level=warning
          if [[ "$REQUIRED" == true ]]; then
            level=error
          fi
          echo "::$level::This repository $missing, which $BOT needs to $TASK; $WITHOUT."
          {
            echo "### ${BOT^} needs the release app of the owner"
            echo
            echo "This repository $missing, which $BOT needs to $TASK; $WITHOUT. The release app is a GitHub App of the owner, whose token may do what the token of a job can't: start the checks of a pull request, change a workflow and apply the settings."
            echo
            echo "\`python3 .github/blueprint.py checklist\` shows the steps: a link that registers the app with its permissions filled in, the update of the answers of the blueprint that names it in \`.github/repository.toml\`, the settings and its private key. Once they are done, $BOT can $TASK in its next run."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$REQUIRED" == true ]]; then
            exit 1
          fi
      # Only what settings apply needs, by GitHub's names: it writes the administration,
      # the variables, the labels and the website, and reads the environments, the names
      # of their secrets and the files of the community standards. The token can't
      # push a commit or change a workflow, and it is for this repository alone.
      - name: Create a token of the release app
        id: app
        if: steps.release-app.outputs.ready == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        env:
          # The action has no input for Variables, which GitHub calls actions_variables,
          # and takes every INPUT_PERMISSION-* of its environment, as the runner passes
          # an input; an input that the action doesn't name would warn in every run.
          INPUT_PERMISSION-ACTIONS-VARIABLES: write
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          permission-administration: write
          permission-issues: write
          permission-pages: write
          permission-actions: read
          permission-contents: read
          permission-environments: read
      # GitHub refuses the whole token when the app lacks one of the permissions that
      # it asks for, as an app registered before the bot asked for it does; a wrong
      # key, a missing installation or an outage fail the step too.
      - name: Explain a refused token
        if: failure() && steps.app.outcome == 'failure'
        run: |
          echo "::error::GitHub refused a token of the release app for the settings bot, most often because the app lacks one of the permissions that the bot asks for; the summary of the run names them and the other causes."
          {
            echo "### The release app refused the token of the settings bot"
            echo
            echo "The settings bot asks the release app for a token with only the permissions that it needs: *Administration*, *Issues*, *Pages* and *Variables* (read and write), and *Actions*, *Contents* and *Environments* (read). GitHub refuses the token when the app lacks one of them, and the log of the step *Create a token of the release app* has its answer. No setting has changed."
            echo
            echo "Most often the app lacks one of them: grant the missing permissions on the settings page of the app, under *Permissions & events*, accept them on the installation of the app, and run the workflow *Settings* again."
            echo
            echo "Other causes, when the app has every permission: a private key in the secret RELEASE_AUTOMATION_PRIVATE_KEY that doesn't belong to the app named by the variable RELEASE_AUTOMATION_CLIENT_ID (generate a new key of that app and store it), an app that isn't installed on this repository (add the repository to its installation), or an outage of GitHub (run the workflow again)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply the settings as code
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Repositories have the copy that the blueprint keeps current; the blueprint
          # has the original.
          script=.github/blueprint.py
          if [[ ! -f "$script" ]]; then
            script=blueprint.py
          fi
          status=0
          python3 "$script" --repo "$GITHUB_REPOSITORY" settings apply > "$RUNNER_TEMP/settings.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/settings.txt"
          {
            echo '### Settings'
            echo '```'
            cat "$RUNNER_TEMP/settings.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
