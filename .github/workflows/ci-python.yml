name: CI (python)

# Python: the hash-pinned tools of requirements-dev.txt and the checks of
# scripts/check.sh, the same ones that run locally. The Python version comes from
# .python-version; the Newest Python workflow runs the checks with the newest one.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (python)
    runs-on: ubuntu-24.04
    # A few times its longest run, so that a run that hangs ends early; a step that
    # installs, builds or downloads ends after five minutes.
    timeout-minutes: 8
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        timeout-minutes: 5
        with:
          python-version-file: .python-version
      # uv installs the tools from its cache, which GitHub keeps under a key of the
      # lock file, and checks the hash of a cached package too.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        timeout-minutes: 5
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: requirements-dev.txt
      - name: Install the hash-pinned tools
        timeout-minutes: 5
        run: uv pip install --system --require-hashes -r requirements-dev.txt
      # mypy starts from what it knew of the code at the last run that passed, and
      # checks again what changed and what depends on it. It keeps no module with an
      # error, so the cache hides no finding.
      - name: Restore the cache of mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}-${{ hashFiles('**/*.py') }}
          restore-keys: mypy-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}-
      - name: Run the checks
        run: bash scripts/check.sh
      - name: Show the coverage
        if: always() && hashFiles('.coverage') != ''
        run: |
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage xml -o "$RUNNER_TEMP/coverage.xml"
      - name: Keep the coverage report
        if: always() && hashFiles('.coverage') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage.xml
          retention-days: 14
