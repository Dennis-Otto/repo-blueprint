name: Docs

# The documentation website. MkDocs with the Material theme builds it from mkdocs.yml
# and the pages in docs/, strictly, so that a link or an anchor that leads nowhere
# fails: in every pull request as the check docs, and on main, where the same job
# hands the website that it built to GitHub Pages, and a second one publishes it. A
# repository without mkdocs.yml or a home page in docs/ has no website, and the
# check passes, so that it can be required everywhere. Where another workflow
# publishes GitHub Pages, as the Dashboard of the blueprint does with its dashboard,
# a run on main only builds the website; in a fork, where the Dashboard doesn't run,
# Docs publishes it. A pull request keeps the website that it built as the artifact
# website for a week, which the report of the PR coach links. The tools are the
# hash-pinned ones of stacks/docs/requirements-docs.txt, which the blueprint keeps
# current, and the files that Material downloads for the website stay in a cache for a
# week. After the build, axe-core checks every page in the light and the dark scheme
# for what WCAG 2.2 A and AA ask, with the locked tools of .github/a11y/.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# One run for each commit of a pull request: a quick check, whose runs for different
# commits never cancel each other, so that a late run for an older commit can't
# cancel the check of the head. Runs on main wait for each other, so that the
# website of the latest commit is published last.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Material theme warns about MkDocs 2.0 in every run; it keeps MkDocs below 2.0
  # itself, so the warning says nothing about this website.
  NO_MKDOCS_2_WARNING: "true"

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read # whether GitHub Pages publishes from this workflow
    outputs:
      publish: ${{ steps.site.outputs.publish }}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The date of the last change of every page comes from the history.
          fetch-depth: 0
      # Every run builds the website here, as the check. A run on main where GitHub
      # Pages publishes from this workflow hands the same build to the job that
      # publishes it, so that it is built once; so does a fork of the blueprint, where
      # the Dashboard doesn't run. Where another workflow publishes the website, a run
      # on main only builds it.
      - name: Look for the website
        id: site
        timeout-minutes: 5
        env:
          EVENT: ${{ github.event_name }}
          FORK: ${{ github.event.repository.fork }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f mkdocs.yml ]] || [[ ! -f docs/index.md && ! -f docs/README.md ]]; then
            echo "::notice::No website here: it needs mkdocs.yml and a home page, docs/index.md."
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" != pull_request && "$GITHUB_REF" == refs/heads/main ]]; then
            # GitHub Pages has one website, and the other workflow publishes it; not in
            # a fork, where the Dashboard of the blueprint doesn't run.
            for workflow in .github/workflows/*.y*ml; do
              if [[ "$FORK" != true && "$workflow" != .github/workflows/docs.yml ]] &&
                grep -qF 'actions/deploy-pages@' "$workflow"; then
                echo "::notice::$workflow publishes this website; this run only builds it."
                exit 0
              fi
            done
            # The settings bot sets GitHub Pages up from the [pages] table of
            # .github/repository.toml; until then, and in forks, nothing is published.
            build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || true)"
            if [[ "$build_type" == workflow ]]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::GitHub Pages doesn't publish from GitHub Actions here yet; the website waits for a run on main after it does."
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.site.outputs.build == 'true'
        timeout-minutes: 5
        with:
          # The Python that the tools of the website are compiled for.
          python-version: "3.12"
      # uv installs the hash-pinned tools in seconds and checks the hash of each
      # package. Its cache keeps only the wheels that it built from source, under a
      # key of the lock file: pre-built ones download faster than a cache restores
      # them.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.site.outputs.build == 'true'
        timeout-minutes: 5
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.12.18"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: stacks/docs/requirements-docs.txt
      - name: Install the hash-pinned tools of the website
        if: steps.site.outputs.build == 'true'
        timeout-minutes: 5
        run: uv pip install --system --require-hashes -r stacks/docs/requirements-docs.txt
      # The privacy and social plugins of Material download the fonts and scripts of
      # the pages, about 30 files, into .cache, which the build takes from there, so a
      # warm cache saves most of its time and the downloads that fail now and then. As
      # Material's documentation has it, the cache belongs to an ISO week: the first
      # run of a week downloads everything again, so that no file is older than a
      # week, and a change of the configuration or the tools starts from the cache of
      # the same week.
      - name: Name the cache of this week
        id: week
        if: steps.site.outputs.build == 'true'
        run: echo "id=$(date -u '+%G-%V')" >> "$GITHUB_OUTPUT"
      - name: Restore the downloads of the website
        id: cache
        if: steps.site.outputs.build == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: .cache
          key: mkdocs-material-${{ steps.week.outputs.id }}-${{ hashFiles('mkdocs.yml', '.github/mkdocs-blueprint.yml', 'stacks/docs/requirements-docs.txt') }}
          restore-keys: mkdocs-material-${{ steps.week.outputs.id }}-
      # The privacy plugin never downloads a file again that it has in its cache. Fonts,
      # stylesheets and scripts may be a week old, but status badges and other pictures
      # show the state of now: a failing CI badge or an old score must not stay up for
      # a week, so the build downloads everything else anew.
      - name: Download the badges and pictures anew
        if: steps.site.outputs.build == 'true'
        run: |
          folder=.cache/plugin/privacy
          [[ ! -d "$folder" ]] || find "$folder" -type f ! -name '*.woff2' ! -name '*.woff'             ! -name '*.ttf' ! -name '*.css' ! -name '*.js' -delete
      - name: Build the website
        if: steps.site.outputs.build == 'true'
        timeout-minutes: 5
        run: mkdocs build --strict
      # The accessibility of the website: .github/a11y/check.mjs opens every page in
      # the Google Chrome of the runner, in the light and the dark scheme, and names
      # each serious or critical violation of WCAG 2.2 A or AA that axe-core finds,
      # with its page and how to fix it, in the summary and as annotations. For one
      # release it only reports, so that every repository can fix its pages before it
      # fails the check.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.site.outputs.build == 'true'
        timeout-minutes: 5
        with:
          node-version: 24
      - name: Check the accessibility of the website
        if: steps.site.outputs.build == 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          REPORT_ONLY: "true"
        run: |
          npm ci --prefix .github/a11y --ignore-scripts --no-audit --no-fund
          node .github/a11y/check.mjs site
      # The website of a pull request, for a week: the report of the PR coach links
      # it, so that a reviewer sees the pages as they will look after the merge.
      - name: Keep the website of the pull request
        if: steps.site.outputs.build == 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 5
        with:
          name: website
          path: site
          retention-days: 7
          include-hidden-files: true
      # Only a push saves the cache: one of main, which every pull request reads, since
      # a cache of a pull request stays with its branch. It saves it once for each
      # key, so a run that restored its own key saves nothing.
      - name: Keep the downloads of the website for the week
        if: >-
          steps.site.outputs.build == 'true' && github.event_name == 'push' &&
          steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: .cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # The website that this job built and checked is the one that GitHub Pages
      # publishes. Files and folders whose name starts with a dot, such as
      # .well-known/security.txt, are part of it; the action leaves out only .git
      # and .github.
      - name: Hand the website to GitHub Pages
        if: steps.site.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        timeout-minutes: 5
        with:
          path: site
          include-hidden-files: true
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: docs
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"

  deploy:
    name: publish the website
    needs: docs
    if: needs.docs.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write # proves to GitHub Pages which workflow publishes
      pages: write # publishes the website
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Publish the website on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
