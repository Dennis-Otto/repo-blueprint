name: Update branches

# The branch bot. main only takes pull requests that are up to date with it, and
# auto-merge doesn't update a branch by itself. So only one pull request can merge
# next, and each merge leaves the others behind again: bringing all of them up to
# date after every merge ran the checks of every waiting pull request for the one
# that merged. The bot keeps a line instead, the pull requests that wait for
# auto-merge in the order in which it was turned on, and brings only the first one up
# to date that can merge, as the release app, so that its checks run again and it
# merges once they pass. While its checks run, the others wait; its merge, or a
# required check of it that fails, starts the next run, and turning auto-merge on
# starts one at once. A pull request whose required check failed waits for a fix and
# leaves its place to the next one. One that conflicts with main gets the label
# merge-conflict and one comment. The label goes once it no longer conflicts; the
# comment stays for the history, so a later conflict brings back only the label. A
# request that GitHub refuses is a warning about that pull request, and the bot goes
# on with the next one. The release bot keeps its own pull request current.
# Renovate's pull requests take their place in the line as well, which spares them
# the wait for its next run: Renovate commits as the release app too, so it still
# takes the branch for its own; one that conflicts with main it builds anew itself.
# The bot checks out main alone, for blueprint.py, which holds the logic, and runs
# nothing of a pull request. https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  # Turning auto-merge on gives a pull request its place in the line at once, and
  # turning it off moves the line on.
  pull_request_target:
    types: [auto_merge_enabled, auto_merge_disabled]
  # A required check that fails moves the line on to the next pull request.
  workflow_run:
    # The workflows of the checks of this repository; the blueprint sets them for each kind of project.
    # Then those of the other required checks and of the scanners, the same in every repository.
    workflows: [CI (python), Variants, Windows, Issue assistant sync, CodeQL, Dependency review, Docs, Lint, Pull request title, Secret scan, Fuzzing, Links, OSV-Scanner, Workflow security]
    types: [completed]
  # Merges that auto-merge does with the token of a workflow, such as those of
  # Dependabot's updates, start no workflow; so the bot looks every half hour too.
  # GitHub runs schedules as it can, often hours late, so this is only a safety net.
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    name: update branches
    # Pull requests of this repository into main, and the failures of their checks.
    if: >-
      !github.event.repository.fork &&
      (github.event_name != 'pull_request_target' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.base.ref == github.event.repository.default_branch)) &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion)))
    # On the job, so that a run whose job skips, as after checks that passed, cancels
    # no run that updates.
    concurrency:
      group: update-branches
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment holds the private key of the release app; only main may use it.
    # Every event of the workflow runs on main, pull_request_target and workflow_run too.
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Create a token of the release app
        id: app
        if: vars.RELEASE_AUTOMATION_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          # Only what the update of a branch, its label and its comment need.
          permission-contents: write
          permission-pull-requests: write
      # The default branch, also for pull_request_target, without the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.app.outputs.token != ''
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            blueprint
      - name: Bring the next pull request that waits for auto-merge up to date
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -o pipefail
          # Repositories have the copy that the blueprint keeps current; the blueprint
          # has the original.
          script=.github/blueprint.py
          if [[ ! -f "$script" ]]; then
            script=blueprint.py
          fi
          python3 "$script" --repo "$GITHUB_REPOSITORY" next-branch | tee -a "$GITHUB_STEP_SUMMARY"
