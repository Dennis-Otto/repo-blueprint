name: Update branches

# The branch bot. main only takes pull requests that are up to date with it, and
# auto-merge doesn't update a branch by itself. So after every change of main, this
# workflow brings each pull request that waits for auto-merge up to date, as the
# release app, so that its checks run again and it merges once they pass. The release
# bot keeps its own pull request current. https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-branches
  cancel-in-progress: true

jobs:
  update:
    name: update branches
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment holds the private key of the release app; only main may use it.
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Create a token of the release app
        id: app
        if: vars.RELEASE_AUTOMATION_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
      - name: Bring the pull requests that wait for auto-merge up to date
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --state open --limit 100 \
            --json number,headRefName,autoMergeRequest,isCrossRepository \
            --jq '.[] | select(.autoMergeRequest != null and (.isCrossRepository | not)
              and (.headRefName | startswith("release-please--") | not)) | "\(.number) \(.headRefName)"' |
            while read -r number branch; do
              behind="$(gh api "repos/$GH_REPO/compare/main...$branch" --jq .behind_by)"
              if [[ "$behind" == 0 ]]; then
                continue
              fi
              echo "#$number is $behind commit(s) behind main."
              gh pr update-branch "$number" ||
                echo "::warning::#$number conflicts with main; its author resolves the conflict."
            done
