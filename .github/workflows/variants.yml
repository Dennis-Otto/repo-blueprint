name: Variants

# Renders every kind of project from this commit and runs what a new repository of
# that kind runs from its first commit: scripts/check.sh with the tools of its stack,
# the build of its website, the lint of its workflows, and hassfest or Hadolint where
# they apply. Every week as well, since the tools and Home Assistant move on their own.
#
# The same again for a repository of each kind that starts from the latest release
# and that the blueprint bot brings to this commit with `copier update`: the update
# must give every file of the blueprint as a new repository with the same answers
# has it (the update keeps the answers, also where a new default came), without a
# conflict and without --trust, and the files of the project, which it keeps, must
# still pass the checks of this commit.
#
# And the same update with the answers of each repository that takes the blueprint,
# from tests/answers/ (adopted): without the sample code, with their licenses, their
# languages and their discussions. Such a repository brings its own code and tests,
# so these legs check what the blueprint gives it alone: the update, the website and
# the lint of the workflows and of the Markdown. The Downstream workflow updates the
# repositories themselves.
#
# And the screenshot bot of a new repository of the kinds whose starter
# scripts/screenshots.sh starts a server in Docker, and of one with the website alone
# (pictures), in a pull request that changes what the pictures depend on, such as an
# update of an image or of Playwright by Renovate, and every week.
#
# Not after a merge: main takes a pull request only when it is up to date, so a merge
# gives main the tree that the pull request ran here. Nor in the release pull request,
# which changes only the changelog and the version, files that no project gets. The
# check variants stands for every variant and every leg of the pictures in the rules
# of main: it passes when each one passed, or when none had to run.
#
# The variants run on the runner of the blueprint's jobs, ubuntu-24.04. The Next
# runner workflow runs them on the next one every week, before the jobs move to it,
# and so can a run started here by hand.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  pull_request:
  schedule:
    - cron: "10 5 * * 3"
  workflow_dispatch:
    inputs:
      runner:
        description: The runner of the variants
        type: choice
        options: [ubuntu-24.04, ubuntu-26.04]
        default: ubuntu-24.04
  workflow_call:
    inputs:
      runner:
        description: The runner of the variants
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  variant:
    # A new repository (variant), one updated from the latest release (update), and
    # one updated with the answers of a repository that takes the blueprint (adopted).
    name: ${{ matrix.start == 'new' && 'variant' || matrix.start }} (${{ matrix.answers || matrix.kind }})
    # Not in the release pull request: the branch of the release bot in this repository.
    if: >-
      !startsWith(github.head_ref, 'release-please--') ||
      github.event.pull_request.head.repo.full_name != github.repository
    # The runner of every job, or the one that a run by hand or the Next runner
    # workflow names.
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    # A few times its longest run, so that a run that hangs ends early; a step that
    # installs, builds or downloads ends after five minutes.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        kind: [home-assistant, nextcloud-app, github-action, python-package, node-package, container, generic]
        start: [new, update]
        # Each file of tests/answers/, with the project_type of its answers.
        include:
          # The new generic repository of an owner other than the blueprint's, without
          # a release app yet: it gets nothing of the blueprint owner's app or person,
          # but a Renovate workflow of its own; and without the AI of the issue
          # assistant, whose check then asks no file to name an engine.
          - { kind: generic, start: new, owner: octo-org, ai: "false" }
          - { kind: generic, start: adopted, answers: dennis-otto.github.io }
          - { kind: home-assistant, start: adopted, answers: homedarts-for-autodarts }
          - { kind: github-action, start: adopted, answers: issue-assistant }
          - { kind: nextcloud-app, start: adopted, answers: paperless-sync }
          - { kind: nextcloud-app, start: adopted, answers: paperless-unified-search }
    env:
      KIND: ${{ matrix.kind }}
      ANSWERS: ${{ matrix.answers }}
      # The owner of the blueprint, as in every repository of the Rollout, unless the
      # leg names another.
      OWNER: ${{ matrix.owner || 'Dennis-Otto' }}
      # The AI of the issue assistant, unless the leg switches it off.
      AI: ${{ matrix.ai || 'true' }}
      # Inside the workspace, where actions such as setup-node look for their files.
      PROJECT: variant
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      # With every tag, for the latest release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        timeout-minutes: 5
        with:
          python-version-file: .python-version
      # uv installs every hash-pinned tool of the variant, Copier, the website's and
      # the project's, in seconds and checks the hash of each package. Its cache keeps
      # only the wheels that it built from source, for each kind under a key of the
      # lock files of the blueprint: pre-built ones download faster than a cache
      # restores them.
      # It takes seconds, but its download from releases.astral.sh hung until the
      # step ran out of its five minutes, in two legs at once (#179). So an attempt
      # that doesn't end within two minutes gives way to a second one, which takes
      # uv from its releases on GitHub instead; the job passes with either.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        id: uv
        continue-on-error: true
        timeout-minutes: 2
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.4"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: |
            requirements-dev.txt
            stacks/**/requirements*.txt
          cache-suffix: ${{ matrix.kind }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.uv.outcome == 'failure'
        timeout-minutes: 5
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.4"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: |
            requirements-dev.txt
            stacks/**/requirements*.txt
          cache-suffix: ${{ matrix.kind }}
          download-from-astral-mirror: false
      - name: Install the hash-pinned Copier
        timeout-minutes: 5
        run: uv pip install --system --require-hashes -r requirements-dev.txt
      - name: Render the project from this commit
        if: matrix.start == 'new'
        timeout-minutes: 5
        run: |
          copier copy --defaults --vcs-ref HEAD \
            --data project_name="Demo Project" \
            --data "description=A $KIND of the blueprint's tests, with \"quotes\" and Ümlauts." \
            --data project_type="$KIND" \
            --data owner="$OWNER" \
            --data issue_assistant_ai="$AI" \
            . "$PROJECT"
          git -C "$PROJECT" init --quiet
          git -C "$PROJECT" add --all
      - name: Render the project from the latest release and update it to this commit
        if: matrix.start != 'new'
        timeout-minutes: 5
        # As the blueprint bot runs Copier: without the maintenance that Git starts in
        # the background after a commit, which Copier's update would collide with.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: "false"
        run: |
          if [[ -n "$ANSWERS" ]]; then
            # The answers of the repository, as its .copier-answers.yml has them.
            data=(--data-file "$GITHUB_WORKSPACE/tests/answers/$ANSWERS.yml")
          else
            data=(
              --data project_name="Demo Project"
              --data "description=A $KIND of the blueprint's tests, with \"quotes\" and Ümlauts."
              --data project_type="$KIND"
              --data owner="$OWNER"
            )
          fi
          # The latest release before this commit; HEAD^ of a release is the one before.
          latest="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD^)"
          # The commit, not HEAD: Copier would take the rendered project, which isn't
          # part of the blueprint, for a change of the template.
          commit="$(git rev-parse HEAD)"
          copier copy --defaults --vcs-ref "$latest" "${data[@]}" "$GITHUB_WORKSPACE" "$PROJECT"
          git -C "$PROJECT" init --quiet
          git -C "$PROJECT" add --all
          git -C "$PROJECT" -c user.name=Variants -c user.email=variants@users.noreply.github.com \
            commit --quiet --message "chore: start from the blueprint $latest"
          # As the blueprint bot does it, without --trust: updating runs no code of the blueprint.
          (cd "$PROJECT" && copier update --defaults --conflict inline --vcs-ref "$commit")
          git -C "$PROJECT" add --all
          echo "The ${ANSWERS:-$KIND} from $latest, updated to ${commit:0:7}." >> "$GITHUB_STEP_SUMMARY"

          # A new repository from this commit with the answers that the update kept, whose
          # files the update must give. With the answers, not with the new defaults: an
          # update keeps an answer of the repository when a later release changes its default.
          python3 - "$PROJECT/.copier-answers.yml" "$RUNNER_TEMP/kept.yml" <<'PYTHON'
          import sys
          from pathlib import Path

          import yaml

          answers = yaml.safe_load(Path(sys.argv[1]).read_text(encoding="utf-8"))
          kept = {key: value for key, value in answers.items() if not key.startswith("_")}
          Path(sys.argv[2]).write_text(yaml.safe_dump(kept, allow_unicode=True), encoding="utf-8")
          PYTHON
          copier copy --defaults --vcs-ref "$commit" --data-file "$RUNNER_TEMP/kept.yml"             "$GITHUB_WORKSPACE" "$RUNNER_TEMP/new"
          python3 - "$PROJECT" "$RUNNER_TEMP/new" <<'PYTHON'
          import difflib
          import os
          import re
          import sys
          from pathlib import Path

          import pathspec
          import yaml

          updated, new = (Path(argument) for argument in sys.argv[1:3])
          config = yaml.safe_load(Path("copier.yml").read_text(encoding="utf-8"))
          # The files of the project, which an update keeps as they are.
          owned = pathspec.PathSpec.from_lines("gitignore", config["_skip_if_exists"])


          def files(root: Path) -> set[str]:
              return {
                  path.relative_to(root).as_posix()
                  for path in root.rglob("*")
                  if path.is_file() and ".git" not in path.relative_to(root).parts
              }


          def lines(path: Path) -> list[str]:
              return path.read_text(encoding="utf-8", errors="replace").splitlines(keepends=True)


          problems, kept = [], []
          for name in sorted(files(updated) | files(new)):
              have, want = updated / name, new / name
              if have.is_file() and re.search(rb"^<{7} ", have.read_bytes(), re.MULTILINE):
                  problems.append(f"{name}: the update left a conflict in it")
              elif owned.match_file(name):
                  if want.is_file() and not (have.is_file() and have.read_bytes() == want.read_bytes()):
                      kept.append(name)
              elif not want.is_file():
                  problems.append(f"{name}: the update leaves it, a new repository doesn't have it")
              elif not have.is_file():
                  problems.append(f"{name}: a new repository has it, the update doesn't bring it")
              elif have.read_bytes() != want.read_bytes():
                  problems.append(f"{name}: the update gives it another content than a new repository has")
                  sys.stdout.writelines(difflib.unified_diff(lines(want), lines(have), f"new/{name}", f"updated/{name}"))

          if kept:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(
                      "\nThese files belong to the project: the update keeps them as the latest release made "
                      "them, and a new repository gets them otherwise. If the files of the blueprint need a "
                      "change of them, the changelog says how an existing project makes it.\n\n"
                  )
                  summary.writelines(f"- `{name}`\n" for name in kept)
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PYTHON
      # The website of the Docs workflow, with the tools the project gets, in an
      # environment of its own and the Python of the blueprint, which they are
      # compiled for, whatever Python the project names.
      - name: Build the website of the project
        working-directory: ${{ env.PROJECT }}
        timeout-minutes: 5
        env:
          NO_MKDOCS_2_WARNING: "true"
        run: |
          # A repository that takes the blueprint without its sample code brings its
          # own home page, without which the Docs workflow builds no website. Only
          # the adopted legs plant one: a new repository must get its own.
          if [[ -n "$ANSWERS" && ! -f docs/index.md && ! -f docs/README.md ]]; then
            printf '# %s\n\nThe home page of the repository.\n' "$ANSWERS" > docs/index.md
          fi
          uv venv --no-project --python "$(command -v python)" "$RUNNER_TEMP/docs"
          uv pip install --python "$RUNNER_TEMP/docs/bin/python" --require-hashes -r .github/docs-requirements.txt
          "$RUNNER_TEMP/docs/bin/mkdocs" build --strict --site-dir "$RUNNER_TEMP/site"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.start != 'adopted' && contains(fromJSON('["home-assistant", "github-action", "python-package"]'), matrix.kind)
        timeout-minutes: 5
        with:
          python-version-file: ${{ env.PROJECT }}/.python-version
      # Into the Python of the project, which is first on the PATH from here on.
      - name: Install the hash-pinned tools of the project
        if: matrix.start != 'adopted' && contains(fromJSON('["home-assistant", "github-action", "python-package"]'), matrix.kind)
        working-directory: ${{ env.PROJECT }}
        timeout-minutes: 5
        run: |
          requirements="requirements-dev.txt"
          if [[ -f requirements-test.txt ]]; then
            requirements="requirements-test.txt"
          fi
          uv pip install --system --require-hashes -r "$requirements"

      # As in the CI of an app: its tools on the PHP of its composer.json, beside the
      # oldest PHP of its appinfo/info.xml.
      - name: Find the PHP of the tools and the oldest PHP of the app
        id: php
        if: matrix.start != 'adopted' && matrix.kind == 'nextcloud-app'
        working-directory: ${{ env.PROJECT }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          import sys
          from xml.etree import ElementTree


          def minor(version):
              return ".".join(version.split(".")[:2])


          with open("composer.json", encoding="utf-8") as manifest:
              platform = json.load(manifest).get("config", {}).get("platform", {})
          php = ElementTree.parse("appinfo/info.xml").find("dependencies/php")
          oldest = minor(php.get("min-version", "")) if php is not None else ""
          tools = minor(platform.get("php", "")) or oldest
          if not tools:
              sys.exit("Neither config.platform.php of composer.json nor appinfo/info.xml names a PHP.")
          print(f"tools={tools}")
          print(f"oldest={oldest or tools}")
          EOF
      - name: Set up the oldest PHP of the app
        if: matrix.kind == 'nextcloud-app' && steps.php.outputs.oldest != steps.php.outputs.tools
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        timeout-minutes: 5
        with:
          php-version: ${{ steps.php.outputs.oldest }}
          extensions: dom, libxml, mbstring, xml
          coverage: none
      - name: Set up the PHP of the tools
        if: matrix.start != 'adopted' && matrix.kind == 'nextcloud-app'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        timeout-minutes: 5
        with:
          php-version: ${{ steps.php.outputs.tools }}
          extensions: dom, libxml, mbstring, xml
          coverage: pcov
          tools: composer:v2
      - name: Install the locked tools of the app
        if: matrix.start != 'adopted' && matrix.kind == 'nextcloud-app'
        working-directory: ${{ env.PROJECT }}
        timeout-minutes: 5
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.start != 'adopted' && matrix.kind == 'node-package'
        timeout-minutes: 5
        with:
          node-version-file: ${{ env.PROJECT }}/.nvmrc
      - name: Install the locked packages
        if: matrix.start != 'adopted' && matrix.kind == 'node-package'
        working-directory: ${{ env.PROJECT }}
        timeout-minutes: 5
        run: npm ci --ignore-scripts

      # Docker exits with 125 when it can't start a container, as when the registry
      # answers the pull of its image with an error: a 502 of Docker Hub failed the
      # lint of the workflows (#179). The docker in front of the runner's on the PATH
      # starts such a container again, after 10 and then 20 seconds, in every step
      # below and in scripts/check.sh; any other exit code, such as that of a check
      # in the container that failed, it passes on at once.
      - name: Let a container whose image failed to download start again
        run: |
          real="$(command -v docker)"
          mkdir -p "$RUNNER_TEMP/retrying"
          {
            echo '#!/usr/bin/env bash'
            printf 'real=%q\n' "$real"
            cat <<'SHIM'
          for attempt in 1 2 3; do
            status=0
            "$real" "$@" || status=$?
            if [[ "$1" != run ]] || ((status != 125 || attempt == 3)); then
              exit "$status"
            fi
            echo "::warning::Docker could not start the container (exit code 125), such as when the registry failed to give its image; it tries again in $((attempt * 10)) seconds."
            sleep $((attempt * 10))
          done
          SHIM
          } > "$RUNNER_TEMP/retrying/docker"
          chmod +x "$RUNNER_TEMP/retrying/docker"
          echo "$RUNNER_TEMP/retrying" >> "$GITHUB_PATH"

      # Hadolint as the CI of a container runs it, in its image, which only this
      # step pulls.
      - name: Lint the Dockerfile
        if: matrix.start != 'adopted' && matrix.kind == 'container'
        timeout-minutes: 5
        run: |
          docker run --rm --volume "$PWD/$PROJECT:/repo:ro" --workdir /repo \
            ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint --no-color Dockerfile

      # Not in a repository that takes the blueprint: its checks need its own code.
      - name: Run the checks of the project
        if: matrix.start != 'adopted'
        working-directory: ${{ env.PROJECT }}
        run: bash scripts/check.sh
      - name: Lint the workflows of the project
        timeout-minutes: 5
        run: |
          docker run --rm --volume "$PWD/$PROJECT:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      # The list of the allowed actions of the project, as its Lint workflow checks
      # it: every action that its workflows run, also in turn, may start. A change of
      # the blueprint that makes a workflow of a kind run one that the list of that
      # kind lacks, such as an update of an action by Renovate, fails here, not in
      # every repository of that kind after the release.
      - name: Check that the allowed actions of the project let every action start
        timeout-minutes: 5
        working-directory: ${{ env.PROJECT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/blueprint.py settings actions
      # The markdownlint-cli2 of the action of the Lint workflow, in its image.
      - name: Lint the Markdown of the project
        timeout-minutes: 5
        run: |
          docker run --rm --volume "$PWD/$PROJECT:/workdir" \
            davidanson/markdownlint-cli2:v0.23.3@sha256:d5f3f3f04b2e285dcbcdcd13b4454d119e273e3c393a9dabd163dba4abad526d \
            "**/*.md"
      # The Renovate of the Renovate workflow, which reads the rules of every project.
      # In a new repository only: an update gives every file of the blueprint as a new
      # repository has it, which its own step compares, and keeps renovate.json5 of
      # the project. The rules depend on the kind of project alone, not on the other
      # answers of a repository that takes the blueprint.
      - name: Validate the rules of Renovate of the project
        if: matrix.start == 'new'
        timeout-minutes: 5
        run: |
          docker run --rm --volume "$PWD/$PROJECT:/usr/src/app" --workdir /usr/src/app \
            ghcr.io/renovatebot/renovate:44.145.1@sha256:6f1f3e2d9d0c3f99aa1f61f7509d302185de7deb173ac8c5ff88a5ce283ec435 \
            renovate-config-validator --strict .github/renovate.json5 .github/renovate-blueprint.json5
      - name: Validate the integration with hassfest
        if: matrix.start != 'adopted' && matrix.kind == 'home-assistant'
        timeout-minutes: 5
        # Home Assistant's current image on purpose, as in the CI of the integrations:
        # it validates against the rules that apply today.
        run: docker run --rm --volume "$PWD/$PROJECT:/github/workspace:ro" ghcr.io/home-assistant/hassfest:latest
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: "${{ matrix.start == 'new' && 'variant' || matrix.start }} (${{ matrix.answers || matrix.kind }})"
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"

  # The screenshot bot of a new repository, which runs its starter
  # scripts/screenshots.sh: the website of every kind, the integration in a Home
  # Assistant and the app in a Nextcloud, each in Docker. Renovate moves their images
  # and the Playwright of the browser on its own, and those updates merge themselves,
  # so the pictures are taken here in a pull request that changes what they depend
  # on, and every week; in any other pull request, each leg passes at once.
  pictures:
    name: pictures (${{ matrix.kind }})
    # Not in the release pull request: the branch of the release bot in this repository.
    if: >-
      !startsWith(github.head_ref, 'release-please--') ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    # A few times its longest run: the images of the browser and the server download
    # within minutes, and the server sets itself up in a few more.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The two kinds that photograph a server of their own, and one with the
        # website alone.
        kind: [home-assistant, nextcloud-app, generic]
    env:
      KIND: ${{ matrix.kind }}
      PROJECT: variant
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A pull request compares its merge commit with the main it merges into.
      - name: Find whether the pull request changes what the pictures depend on
        id: due
        env:
          EVENT: ${{ github.event_name }}
        run: |
          due=true
          if [[ "$EVENT" == pull_request ]] && git diff --quiet HEAD^1 HEAD -- \
            ':(glob)template/scripts/*screenshots*' ':(glob)template/scripts/*social-preview*' \
            ':(glob)template/.github/*screenshots*' ':(glob)template/.github/social-preview*' \
            ':(glob)template/.github/social-preview/**' .github/social-preview/ \
            stacks/screenshots/ stacks/docs/ ':(glob)template/mkdocs*' .github/mkdocs_project.py \
            ':(glob)template/*custom_components*/**' ':(glob)template/*appinfo*/**' \
            .github/workflows/variants.yml; then
            due=false
            echo "The pull request changes nothing that the pictures depend on." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.due.outputs.due == 'true'
        timeout-minutes: 5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.due.outputs.due == 'true'
        timeout-minutes: 5
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.4"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: |
            requirements-dev.txt
            stacks/**/requirements*.txt
          cache-suffix: pictures-${{ matrix.kind }}
      - name: Install the hash-pinned Copier
        if: steps.due.outputs.due == 'true'
        timeout-minutes: 5
        run: uv pip install --system --require-hashes -r requirements-dev.txt
      - name: Render the project from this commit
        if: steps.due.outputs.due == 'true'
        timeout-minutes: 5
        run: |
          copier copy --defaults --vcs-ref HEAD \
            --data project_name="Demo Project" \
            --data "description=A $KIND of the blueprint's tests." \
            --data project_type="$KIND" \
            --data owner=Dennis-Otto \
            . "$PROJECT"
          git -C "$PROJECT" init --quiet
          git -C "$PROJECT" add --all
      # The tools of the website in .venv-docs, as CONTRIBUTING.md of the project sets
      # them up, with the Python of the blueprint, which they are compiled for.
      - name: Install the tools of the website of the project
        if: steps.due.outputs.due == 'true'
        working-directory: ${{ env.PROJECT }}
        timeout-minutes: 5
        run: |
          uv venv --no-project --python "$(command -v python)" .venv-docs
          uv pip install --python .venv-docs/bin/python --require-hashes -r .github/docs-requirements.txt
      - name: Photograph the project as its screenshot bot does
        if: steps.due.outputs.due == 'true'
        working-directory: ${{ env.PROJECT }}
        timeout-minutes: 20
        run: |
          bash scripts/screenshots.sh
          pictures=(website)
          case "$KIND" in
            home-assistant) pictures+=(home-assistant) ;;
            nextcloud-app) pictures+=(nextcloud) ;;
          esac
          for name in "${pictures[@]}"; do
            for picture in "docs/images/screenshots/$name.png" "docs/images/screenshots/$name.dark.png"; do
              # Each one a PNG, by the first bytes of its file.
              if [[ "$(head -c 8 "$picture" 2>/dev/null | od -An -tx1 | tr -d ' \n')" != 89504e470d0a1a0a ]]; then
                echo "::error::scripts/screenshots.sh took no picture $picture."
                exit 1
              fi
              echo "Took $picture." >> "$GITHUB_STEP_SUMMARY"
            done
          done
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: pictures (${{ matrix.kind }})
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"

  # The rules of main require this one check, not each variant: a matrix that its
  # condition skips reports none of its legs.
  variants:
    name: variants
    if: always()
    needs: [variant, pictures]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Require every variant to pass, or none to run
        env:
          RESULT: ${{ needs.variant.result }} ${{ needs.pictures.result }}
        run: |
          echo "The variants and their pictures: $RESULT"
          read -ra results <<<"$RESULT"
          for result in "${results[@]}"; do
            [[ "$result" == success || "$result" == skipped ]]
          done
      # The PR coach needs blueprint.py and .github/checks.toml, nothing else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: failure()
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            blueprint
      # The PR coach: what failed, why it matters and how to fix it, in the summary
      # of the check and as its annotation, from .github/checks.toml.
      - name: Explain the failure
        if: failure()
        env:
          CHECK: variants
        run: |
          script=.github/blueprint.py
          [[ -f "$script" ]] || script=blueprint.py
          python3 "$script" coach explain "$CHECK"
