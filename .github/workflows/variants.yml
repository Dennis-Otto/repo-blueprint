name: Variants

# Renders every kind of project from this commit and runs what a new repository of
# that kind runs from its first commit: scripts/check.sh with the tools of its stack,
# the build of its website, the lint of its workflows, and hassfest or Hadolint where
# they apply. Every week as well, since the tools and Home Assistant move on their own.
#
# The same again for a repository of each kind that starts from the latest release
# and that the blueprint bot brings to this commit with `copier update`: the update
# must give every file of the blueprint as a new repository has it, without a
# conflict and without --trust, and the files of the project, which it keeps, must
# still pass the checks of this commit.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "10 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  variant:
    # A new repository (variant) and one updated from the latest release (update).
    name: ${{ matrix.start == 'update' && 'update' || 'variant' }} (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kind: [home-assistant, nextcloud-app, github-action, python-package, node-package, container, generic]
        start: [new, update]
    env:
      KIND: ${{ matrix.kind }}
      # Inside the workspace, where actions such as setup-node look for their files.
      PROJECT: variant
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # With every tag, for the latest release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the hash-pinned Copier
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Render the project from this commit
        if: matrix.start == 'new'
        run: |
          copier copy --defaults --vcs-ref HEAD \
            --data project_name="Demo Project" \
            --data "description=A $KIND of the blueprint's tests, with \"quotes\" and Ümlauts." \
            --data project_type="$KIND" \
            . "$PROJECT"
          git -C "$PROJECT" init --quiet
          git -C "$PROJECT" add --all
      - name: Render the project from the latest release and update it to this commit
        if: matrix.start == 'update'
        run: |
          data=(
            --data project_name="Demo Project"
            --data "description=A $KIND of the blueprint's tests, with \"quotes\" and Ümlauts."
            --data project_type="$KIND"
          )
          # The latest release before this commit; HEAD^ of a release is the one before.
          latest="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD^)"
          # The commit, not HEAD: Copier would take the rendered project, which isn't
          # part of the blueprint, for a change of the template.
          commit="$(git rev-parse HEAD)"
          copier copy --defaults --vcs-ref "$latest" "${data[@]}" "$GITHUB_WORKSPACE" "$PROJECT"
          git -C "$PROJECT" init --quiet
          git -C "$PROJECT" add --all
          git -C "$PROJECT" -c user.name=Variants -c user.email=variants@users.noreply.github.com \
            commit --quiet --message "chore: start from the blueprint $latest"
          # As the blueprint bot does it, without --trust: updating runs no code of the blueprint.
          (cd "$PROJECT" && copier update --defaults --conflict inline --vcs-ref "$commit")
          git -C "$PROJECT" add --all
          echo "The $KIND from $latest, updated to ${commit:0:7}." >> "$GITHUB_STEP_SUMMARY"

          # A new repository from this commit, whose files the update must give.
          copier copy --defaults --vcs-ref "$commit" "${data[@]}" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/new"
          python3 - "$PROJECT" "$RUNNER_TEMP/new" <<'PYTHON'
          import difflib
          import os
          import re
          import sys
          from pathlib import Path

          import pathspec
          import yaml

          updated, new = (Path(argument) for argument in sys.argv[1:3])
          config = yaml.safe_load(Path("copier.yml").read_text(encoding="utf-8"))
          # The files of the project, which an update keeps as they are.
          owned = pathspec.PathSpec.from_lines("gitignore", config["_skip_if_exists"])


          def files(root: Path) -> set[str]:
              return {
                  path.relative_to(root).as_posix()
                  for path in root.rglob("*")
                  if path.is_file() and ".git" not in path.relative_to(root).parts
              }


          def lines(path: Path) -> list[str]:
              return path.read_text(encoding="utf-8", errors="replace").splitlines(keepends=True)


          problems, kept = [], []
          for name in sorted(files(updated) | files(new)):
              have, want = updated / name, new / name
              if have.is_file() and re.search(rb"^<{7} ", have.read_bytes(), re.MULTILINE):
                  problems.append(f"{name}: the update left a conflict in it")
              elif owned.match_file(name):
                  if want.is_file() and not (have.is_file() and have.read_bytes() == want.read_bytes()):
                      kept.append(name)
              elif not want.is_file():
                  problems.append(f"{name}: the update leaves it, a new repository doesn't have it")
              elif not have.is_file():
                  problems.append(f"{name}: a new repository has it, the update doesn't bring it")
              elif have.read_bytes() != want.read_bytes():
                  problems.append(f"{name}: the update gives it another content than a new repository has")
                  sys.stdout.writelines(difflib.unified_diff(lines(want), lines(have), f"new/{name}", f"updated/{name}"))

          if kept:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(
                      "\nThese files belong to the project: the update keeps them as the latest release made "
                      "them, and a new repository gets them otherwise. If the files of the blueprint need a "
                      "change of them, the changelog says how an existing project makes it.\n\n"
                  )
                  summary.writelines(f"- `{name}`\n" for name in kept)
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PYTHON
      # The website of the Docs workflow, with the tools the project gets, in an
      # environment of its own and the Python they are compiled for.
      - name: Build the website of the project
        working-directory: ${{ env.PROJECT }}
        env:
          NO_MKDOCS_2_WARNING: "true"
        run: |
          python -m venv "$RUNNER_TEMP/docs"
          "$RUNNER_TEMP/docs/bin/pip" install --require-hashes -r .github/docs-requirements.txt
          "$RUNNER_TEMP/docs/bin/mkdocs" build --strict --site-dir "$RUNNER_TEMP/site"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: contains(fromJSON('["home-assistant", "github-action", "python-package"]'), matrix.kind)
        with:
          python-version-file: ${{ env.PROJECT }}/.python-version
      - name: Install the hash-pinned tools of the project
        if: contains(fromJSON('["home-assistant", "github-action", "python-package"]'), matrix.kind)
        working-directory: ${{ env.PROJECT }}
        run: |
          requirements="requirements-dev.txt"
          if [[ -f requirements-test.txt ]]; then
            requirements="requirements-test.txt"
          fi
          pip install --require-hashes -r "$requirements"

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: matrix.kind == 'nextcloud-app'
        with:
          php-version: "8.2"
          extensions: dom, libxml, mbstring, xml
          coverage: pcov
          tools: composer:v2
      - name: Install the locked tools of the app
        if: matrix.kind == 'nextcloud-app'
        working-directory: ${{ env.PROJECT }}
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.kind == 'node-package'
        with:
          node-version-file: ${{ env.PROJECT }}/.nvmrc
      - name: Install the locked packages
        if: matrix.kind == 'node-package'
        working-directory: ${{ env.PROJECT }}
        run: npm ci --ignore-scripts

      - name: Lint the Dockerfile
        if: matrix.kind == 'container'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ env.PROJECT }}/Dockerfile

      - name: Run the checks of the project
        working-directory: ${{ env.PROJECT }}
        run: bash scripts/check.sh
      - name: Lint the workflows of the project
        run: |
          docker run --rm --volume "$PWD/$PROJECT:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      # The markdownlint-cli2 of the action of the Lint workflow, in its image.
      - name: Lint the Markdown of the project
        run: |
          docker run --rm --volume "$PWD/$PROJECT:/workdir" \
            davidanson/markdownlint-cli2:v0.23.2@sha256:839558fd0d36c46da0e01ea84fd1d20a2822b5a8a60c16dc9708f0bb7c9e903b \
            "**/*.md"
      # The Renovate of the Renovate workflow, which reads the rules of every project.
      - name: Validate the rules of Renovate of the project
        run: |
          docker run --rm --volume "$PWD/$PROJECT:/usr/src/app" --workdir /usr/src/app \
            ghcr.io/renovatebot/renovate:44.145.1@sha256:6f1f3e2d9d0c3f99aa1f61f7509d302185de7deb173ac8c5ff88a5ce283ec435 \
            renovate-config-validator --strict .github/renovate.json5 .github/renovate-blueprint.json5
      - name: Validate the integration with hassfest
        if: matrix.kind == 'home-assistant'
        # Home Assistant's current image on purpose, as in the CI of the integrations:
        # it validates against the rules that apply today.
        run: docker run --rm --volume "$PWD/$PROJECT:/github/workspace:ro" ghcr.io/home-assistant/hassfest:latest
