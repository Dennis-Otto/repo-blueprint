name: Docs pictures

# The picture bot of the blueprint's own documentation. scripts/docs-pictures.sh
# records a copy of the latest release with Copier and photographs the dashboard of
# the website, so the bot runs after a release that changed what they show: the
# questions or the output of Copier, the files and workflows of a new repository, the
# image of the recording or the dashboard, as .github/docs-pictures/paths.txt lists
# them, and on demand. It renders the pictures without secrets, keeps those whose
# pixels stayed the same (blueprint.py screenshots keep), and keeps one pull request
# from the branch bot/pictures with the others, as the release app, which merges
# itself once every check passes. The recording waits for the network, so a frame
# that repeats the one before counts once and the time each frame shows not at all.
# A failed run keeps an issue of the bot-health bot open until a run passes again.
# It runs in the blueprint only; every repository has the Screenshots workflow.
# https://github.com/Dennis-Otto/repo-blueprint

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

# One run at a time, which ends what it started with the branch and the pull request.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # The branch of the pull request, and the first line of its commits and its title.
  BRANCH: bot/pictures
  HEADLINE: "docs: renew the pictures"
  SCRIPT: scripts/docs-pictures.sh
  PATHS: .github/docs-pictures/paths.txt

jobs:
  plan:
    name: plan the pictures
    # Of the runs of the Release workflow, only one that passed for the push of the
    # merge of a release pull request made a release; its daily, manual and restarted
    # runs see the same release commit while main stays on it.
    if: >-
      github.repository == 'Dennis-Otto/repo-blueprint' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          startsWith(github.event.workflow_run.head_commit.message, 'chore: release ')
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      due: ${{ steps.plan.outputs.due }}
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # The history and the tags without the contents of the files, to see what the
      # release changed, and only the files of the bot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
            blueprint
            scripts
      - name: Decide whether the bot renders the pictures
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          RELEASED: ${{ github.event.workflow_run.head_sha }}
        run: |
          # After a release, what changed since the release before it; by hand, always.
          since=""
          until=HEAD
          if [[ "$EVENT" == workflow_run ]]; then
            until="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "$RELEASED")"
            since="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "$until^")"
            echo "The release $until, since $since." >> "$GITHUB_STEP_SUMMARY"
          fi
          if python3 blueprint.py screenshots due --script "$SCRIPT" --paths "$PATHS" \
            --since "$since" --until "$until" >> "$GITHUB_STEP_SUMMARY"; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          elif (($? != 1)); then
            exit 1
          fi

  render:
    name: render the pictures
    needs: plan
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      stale: ${{ steps.keep.outputs.stale }}
    steps:
      # VHS clones the blueprint from GitHub, and the browser loads the website.
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        timeout-minutes: 5
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.0"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: stacks/screenshots/requirements.txt
      - name: Install Pillow, which compares the pictures
        timeout-minutes: 5
        run: |
          uv venv --quiet "$RUNNER_TEMP/pictures"
          uv pip install --quiet --python "$RUNNER_TEMP/pictures" --require-hashes -r stacks/screenshots/requirements.txt
      - name: Render the pictures
        timeout-minutes: 15
        run: bash "$SCRIPT"
      - name: Compare the pictures with those of main
        id: keep
        run: |
          kept="$RUNNER_TEMP/pictures-kept"
          "$RUNNER_TEMP/pictures/bin/python" blueprint.py screenshots keep "$kept" > "$RUNNER_TEMP/summary.md"
          {
            echo "### Pictures"
            cat "$RUNNER_TEMP/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$kept/report.json" ]]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep the pictures for the pull request
        if: steps.keep.outputs.stale == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pictures
          path: ${{ runner.temp }}/pictures-kept/
          if-no-files-found: error
          retention-days: 3

  pull-request:
    name: keep the pull request of the pictures
    needs: render
    # Once main was rendered, to open, update or close the pull request.
    if: needs.render.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment holds the private key of the release app; only main may use it.
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # blueprint.py, which checks what the job render kept.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: blueprint
      - name: Fetch the pictures that the job render kept
        if: needs.render.outputs.stale == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pictures
          path: ${{ runner.temp }}/pictures-kept
      - name: Create a token of the release app
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          # As for the screenshot bot: the branch and the pull request, and workflows
          # to move the branch of an open pull request onto a newer main.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Open, update or close the pull request of the pictures
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          STALE: ${{ needs.render.outputs.stale }}
          SHA: ${{ github.sha }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open="$(gh pr list --head "$BRANCH" --state open --json number,isCrossRepository,author \
            --jq "map(select(.isCrossRepository == false and .author.login == \"app/$APP_SLUG\"))[0].number // empty")"
          if [[ "$STALE" != true ]]; then
            if [[ -n "$open" ]]; then
              gh pr close "$open" --delete-branch \
                --comment "\`main\` looks as rendered without this pull request: $URL"
              echo "main looks as rendered; closed #$open." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          # As the screenshot bot does: the commits on a branch of their own from the
          # commit that was rendered, then the branch of the pull request moves there.
          point() {
            if gh api "repos/$GH_REPO/git/ref/heads/$1" > /dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/heads/$1" -f sha="$2" -F force=true > /dev/null
            else
              gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$1" -f sha="$2" > /dev/null
            fi
          }
          scratch="$BRANCH-next"
          if gh api "repos/$GH_REPO/git/ref/heads/$scratch" > /dev/null 2>&1; then
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$scratch" > /dev/null
          fi
          gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$scratch" -f sha="$SHA" > /dev/null
          kept="$RUNNER_TEMP/pictures-kept"
          user_id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          body="Rendered by $SCRIPT on $SHA, the pictures whose pixels changed: $URL

          Signed-off-by: ${APP_SLUG}[bot] <${user_id}+${APP_SLUG}[bot]@users.noreply.github.com>"
          head="$SHA"
          parts="$(python3 blueprint.py screenshots parts "$kept")"
          for ((part = 1; part <= parts; part++)); do
            python3 blueprint.py --repo "$GH_REPO" screenshots commit "$kept" --branch "$scratch" \
              --head "$head" --headline "$HEADLINE" --body "$body" --part "$part" > "$RUNNER_TEMP/commit.json"
            head="$(gh api graphql --input "$RUNNER_TEMP/commit.json" --jq .data.createCommitOnBranch.commit.oid)"
          done
          point "$BRANCH" "$head"
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$scratch" > /dev/null
          python3 blueprint.py screenshots report "$kept" --sha "$SHA" --run "$URL" --script "$SCRIPT" > "$RUNNER_TEMP/body.md"
          if [[ -n "$open" ]]; then
            gh pr edit "$open" --title "$HEADLINE" --body-file "$RUNNER_TEMP/body.md"
          else
            created="$(gh pr create --base main --head "$BRANCH" --title "$HEADLINE" --body-file "$RUNNER_TEMP/body.md")"
            open="${created##*/}"
          fi
          gh pr merge "$open" --auto --squash
          echo "The pull request of the pictures, #$open from $BRANCH, has the commit $head, and merges itself once every check passes." >> "$GITHUB_STEP_SUMMARY"
