# Every label of the repository. The Labels workflow of the issue assistant
# (https://github.com/Dennis-Otto/issue-assistant) creates missing labels and updates
# color and description from this file when it changes on main; it never deletes a
# label. Rename a label on GitHub first, then here.
#
# group decides who sets a label:
#   type       the kind of an issue; the issue forms set one, the assistant may correct it
#   area       the part of the project; set from the Area field and by the assistant
#   topic      cross-cutting topics the assistant may add
#   lifecycle  set and removed by the issue assistant's rules
#   decision   set by the maintainer only
#   release    set by the pull request title check and the release bot
#   dependabot set by Dependabot on its pull requests
#
# ask = false keeps the assistant from asking reporters of that kind for information.

# Types

[[label]]
name = "bug"
color = "d73a4a"
description = "Something isn't working"
group = "type"

[[label]]
name = "enhancement"
color = "a2eeef"
description = "New feature or improvement"
group = "type"
ask = false

[[label]]
name = "question"
color = "d876e3"
description = "A question about setup or use"
group = "type"

[[label]]
name = "documentation"
color = "0075ca"
description = "Improvements or additions to documentation"
group = "type"
form_options = ["Documentation"]

[[label]]
name = "maintenance"
color = "6f42c1"
description = "CI, repository maintenance and release tooling"
group = "type"

# Areas, with the options of the Area field of the issue forms

[[label]]
