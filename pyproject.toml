# The settings of the tools that scripts/check.sh runs.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "mutation_unsafe: fails in the copy of the repository with the mutants, which has no Git and other code; the Mutation workflow leaves it out",
]

[tool.coverage.run]
branch = true
# By the names of the modules, not by folders, so that the coverage report names
# every file by its path from the root, such as blueprint/cli.py, not cli.py: blueprint
# is the package blueprint/, which the script blueprint.py only starts, and
# mkdocs_blueprint and mkdocs_project the hooks of the website in .github/.
source_pkgs = ["blueprint", "dashboard", "weekly", "sync_issue_assistant", "mkdocs_blueprint", "mkdocs_project"]
# The tests render the template, and Jinja runs its includes of the tool as
# templates of the same names in a temporary clone; that is no code of the tool.
omit = ["*/copier._vcs.clone*/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']

# The tool has the same settings in blueprint/ruff.toml, which it brings into every
# repository; a test keeps the two equal.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
# The package, not the script that starts it: mypy would find the module blueprint
# twice. A test runs the script.
files = ["blueprint", "dashboard.py", "weekly.py", "sync_issue_assistant.py", ".github/mkdocs_blueprint.py", ".github/mkdocs_project.py", "tests"]
