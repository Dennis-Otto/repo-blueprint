# The settings of the tools that scripts/check.sh runs.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["blueprint", "dashboard", "weekly"]
# The tests render the template, and Jinja runs its include of blueprint.py as a
# template of the same name in a temporary clone; that is no code of the tool.
omit = ["*/copier._vcs.clone*/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["blueprint.py", "dashboard.py", "weekly.py", "tests"]
