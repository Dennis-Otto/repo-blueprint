# The settings of the tools that scripts/check.sh runs.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config"]
# A test that hangs fails after five minutes instead of blocking the run, locally as
# in the CI; a test of the template that renders a project takes seconds.
timeout = 300
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "mutation_unsafe: fails in the copy of the repository with the mutants, which has no Git and other code; the Mutation workflow leaves it out",
]

[tool.coverage.run]
branch = true
# By the names of the modules, not by folders, so that the coverage report names
# every file by its path from the root, such as blueprint/cli.py, not cli.py: blueprint
# is the package blueprint/, which the script blueprint.py only starts, and
# mkdocs_blueprint and mkdocs_project the hooks of the website in .github/, and
# github_pages the pictures of GitHub's pages in .github/docs-pictures/.
source_pkgs = ["blueprint", "dashboard", "weekly", "sync_issue_assistant", "pins", "downstream", "reference", "mkdocs_blueprint", "mkdocs_project", "github_pages"]
# The tests render the template from a copy of the blueprint, and Jinja runs its
# includes of the tool, such as blueprint.py, as templates of the same names there;
# that is no code of the tool.
omit = ["*/copy-of-the-blueprint/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']

# The tool has the same settings in blueprint/ruff.toml, which it brings into every
# repository; a test keeps the two equal.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
# The package, not the script that starts it: mypy would find the module blueprint
# twice. A test runs the script.
files = ["blueprint", "dashboard.py", "weekly.py", "sync_issue_assistant.py", "pins.py", "downstream.py", "reference.py", ".github/mkdocs_blueprint.py", ".github/mkdocs_project.py", ".github/docs-pictures/github_pages.py", "tests"]

[[tool.mypy.overrides]]
# PyYAML, which Copier brings, has no types of its own, and downstream.py and its tests
# only read and write the answers of Copier with it.
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Playwright runs only in the browser's image, where scripts/docs-pictures.sh starts
# .github/docs-pictures/github_pages.py; its tests bring a Playwright of their own.
module = ["playwright.*"]
ignore_missing_imports = true
