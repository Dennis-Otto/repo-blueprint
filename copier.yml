# The questions of the blueprint and how it renders. Files of the template are in
# template/; workflows, dependency manifests and other shared files come from this
# repository itself, where they run and Renovate keeps them current.
# https://github.com/Dennis-Otto/repo-blueprint

_min_copier_version: "9.8"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

# Delimiters that no workflow, script or manifest contains: the ${{ }} of GitHub
# Actions, the [[ ]] of Bash and TOML and the {% %} of other templates stay as they
# are, also in the files the templates include from this repository.
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "{="
  variable_end_string: "=}"
  comment_start_string: "[#"
  comment_end_string: "#]"
  keep_trailing_newline: true

# Each kind of project gets the files of its stack and its way of delivery: the
# files and folders of template/ carry their condition in their name, such as
# "[% if stack == 'php' %]composer.json[% endif %]". A name that renders empty is
# left out, with everything inside.

# After the first copy, these belong to the project: an update never overwrites
# them. Renovate keeps the dependency manifests of the project current. The
# patterns follow .gitignore: those without a slash would match at any depth, so
# the files of the root start with one. template/AGENTS.md.jinja lists them for
# coding agents, and a test keeps both lists equal.
_skip_if_exists:
  - /README.md
  - /CHANGELOG.md
  - /version.txt
  - /.release-please-manifest.json
  - /mkdocs.yml
  - /docs/index.md
  - /docs/security.md
  - /docs/releases.md
  - .github/issue-assistant/project.md
  - .github/agents.project.md
  - /docs/decisions
  - .github/ISSUE_TEMPLATE/bug_report.yml
  - .github/ISSUE_TEMPLATE/feature_request.yml
  - .github/ISSUE_TEMPLATE/config.yml
  - .github/DISCUSSION_TEMPLATE/q-a.yml
  - .github/DISCUSSION_TEMPLATE/ideas.yml
  - .github/labels.toml
  - .github/labeler.yml
  - /.markdownlint.jsonc
  - .github/cspell-words.txt
  - .github/renovate.json5
  - .github/renovate-accepted.json5
  - /osv-scanner.toml
  - .github/findings.toml
  - .github/dependency-review.yml
  - .github/social-preview.html
  - /scripts/screenshots.sh
  - /scripts/release-assets.sh
  - .github/screenshots-paths.txt
  - .github/repository.project.toml
  - .github/checks.project.toml
  - .github/workflows/action-test.yml
  - /.lycheeignore
  - /pyproject.toml
  - /requirements-dev.in
  - /requirements-dev.txt
  - /requirements-test.in
  - /requirements-test.txt
  - /requirements-fuzz.in
  - /requirements-fuzz.txt
  - /fuzz
  - /composer.json
  - /composer.lock
  - /package.json
  - /package-lock.json
  - /extension
  - /store
  - /Dockerfile
  - /action.yml
  - /hacs.json
  - /src
  - /lib
  - /app
  - /appinfo
  - /img
  - /custom_components
  - /tests
  - /test
  - "/*.py"

# What Copier says before its questions, when no answer is known yet, and after it
# wrote the files. The README says the same in its quick start, for a new copy:
# blueprint.py create comes with every copy, so no checkout of the blueprint is needed.
_message_before_copy: |
  Repo Blueprint asks for the name, the kind and the owner of the project and writes
  its files. Copying runs no code of the blueprint, so Copier needs no --trust. The
  repository on GitHub follows with one command, which needs Git, Python 3.12 or
  later and GitHub CLI 2.48 or later, signed in as an administrator of the owner
  (gh auth login).

_message_after_copy: |
  {= project_name =} is ready. Make it the repository {= owner =}/{= project_slug =} on GitHub:
  [% set folder = _copier_conf.dst_path | string %][% if folder != '.' %]
    cd {= ('"' ~ folder ~ '"') if ' ' in folder else folder =}[% endif %]
    python3 .github/blueprint.py create

  create commits the files on the branch main, with a sign-off, creates the public
  repository with gh repo create and pushes, applies the settings as code and shows
  the checklist, which names what only a person can do, such as the secrets. Add
  --private for a private repository, or --dry-run to see the commands first. On
  Windows, py -3 runs Python.
  [%- if not release_app %]

  The checklist starts with the release app of {= owner =}, which opens the release and
  update pull requests and runs the bots: python3 .github/blueprint.py app register
  registers one, sets its private key and opens the pull request that names it in
  .github/repository.toml.
  [%- endif %]

# The name and the description stand as they are in a docstring of Python, a comment
# of TypeScript and the CDATA of appinfo/info.xml, which """, */ and ]]> would end,
# and a backslash would start an escape there; the other files escape them.
project_name:
  type: str
  help: The name of the project, such as "Paperless Sync"
  validator: >-
    [% if not project_name.strip() %]Name the project.[% elif project_name | regex_search('"""|[*]/|]]>|[\\\\\r\n]') %]Write the name without """, */, ]]>, backslashes and line breaks, which would end or break the code that names it.[% endif %]

project_slug:
  type: str
  help: The name of the repository; owner.github.io, such as dennis-otto.github.io, for the website of the owner itself
  default: "{= project_name | lower | regex_replace('[^a-z0-9]+', '-') | trim('-') =}"
  validator: >-
    [% if not (project_slug | regex_search('^[a-z0-9][a-z0-9-]*[a-z0-9]$') or (project_slug.endswith('.github.io') and project_slug[:-10] | regex_search('^[a-z0-9][a-z0-9-]*[a-z0-9]$'))) %]Use lowercase letters, digits and hyphens, or the name of the website of an owner, such as dennis-otto.github.io.[% endif %]

description:
  type: str
  help: One sentence that says what the project does
  validator: >-
    [% if not description.strip() %]Describe the project in one sentence.[% elif description | regex_search('"""|[*]/|]]>|[\\\\\r\n]') %]Write the description without """, */, ]]>, backslashes and line breaks, which would end or break the code that quotes it.[% endif %]

project_type:
  type: str
  help: The kind of project
  choices:
    Home Assistant integration (Python, HACS): home-assistant
    Nextcloud app (PHP, App Store): nextcloud-app
    GitHub Action (Python, composite): github-action
    Python package (PyPI): python-package
    Node package (TypeScript, npm): node-package
    Chrome extension (Manifest V3, Chrome Web Store): chrome-extension
    Container image (GHCR): container
    Repository without a build (docs, configuration, scripts): generic

# The owner of this blueprint, whose own repositories keep its name and its release
# app as their defaults; every other owner names their own. A fork of the blueprint
# names its owner here. Never asked and not stored.
blueprint_owner:
  type: yaml
  when: false
  default:
    account: Dennis-Otto
    author: Dennis Otto
    release_app: dennis-otto-release-automation
    release_app_client_id: Iv23liP9PIEHOV74AiIA
    release_app_id: "4739928"

# No default: each owner names their account, or sets it once for all of their
# repositories in the defaults of Copier's settings file.
owner:
  type: str
  help: The GitHub account or organization of the repository, such as octo-org
  validator: >-
    [% if not (owner | regex_search('^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?$')) %]Name the GitHub account or organization of the repository, such as octo-org.[% endif %]

author:
  type: str
  help: The maintainer, named in the license and the governance
  default: "[% if owner == blueprint_owner.account %]{= blueprint_owner.author =}[% else %]{= owner =}[% endif %]"
  validator: "[% if not author.strip() %]Name the maintainer.[% endif %]"

copyright:
  type: str
  help: The copyright of the license, years and holder; several separated by semicolons
  default: "{= '%Y' | strftime =} {= author =}"

license:
  type: str
  help: The license
  default: "[% if project_type == 'nextcloud-app' %]AGPL-3.0-or-later[% else %]MIT[% endif %]"
  choices:
    MIT: MIT
    MIT No Attribution (MIT-0): MIT-0
    BSD 3-Clause: BSD-3-Clause
    Apache 2.0: Apache-2.0
    GPL 3.0 or later: GPL-3.0-or-later
    AGPL 3.0 or later: AGPL-3.0-or-later

python_package:
  type: str
  help: The name of the Python package or module
  default: "{= project_slug | replace('-', '_') =}"
  when: "{= project_type in ['python-package', 'github-action', 'home-assistant'] =}"
  validator: >-
    [% if not (python_package | regex_search('^[a-z_][a-z0-9_]*$')) %]Use lowercase letters, digits and underscores.[% endif %]

ha_domain:
  type: str
  help: The domain of the integration in Home Assistant
  default: "{= python_package =}"
  when: "{= project_type == 'home-assistant' =}"
  validator: >-
    [% if not (ha_domain | regex_search('^[a-z_][a-z0-9_]*$')) %]Use lowercase letters, digits and underscores.[% endif %]

# The App Store takes an id of 32 characters at most, from a lowercase letter to a
# letter or a digit, as the schema of appinfo/info.xml says.
nextcloud_app_id:
  type: str
  help: The id of the Nextcloud app, 32 characters at most
  default: "{= (project_slug | replace('-', '_'))[:32] | trim('_') =}"
  when: "{= project_type == 'nextcloud-app' =}"
  validator: >-
    [% if not (nextcloud_app_id | regex_search('^[a-z][a-z0-9_]*[a-z0-9]$')) or nextcloud_app_id | length > 32 %]Use 2 to 32 lowercase letters, digits and underscores, from a letter to a letter or a digit, as the App Store takes them.[% endif %]

nextcloud_namespace:
  type: str
  help: The PHP namespace of the app, under OCA
  default: "{= project_name | regex_replace('[^A-Za-z0-9]+', ' ') | title | replace(' ', '') =}"
  when: "{= project_type == 'nextcloud-app' =}"
  validator: >-
    [% if not (nextcloud_namespace | regex_search('^[A-Z][A-Za-z0-9_]*$')) %]Use a name of PHP in CamelCase, such as PaperlessSync or Files_Sharing: a capital letter, then letters, digits and underscores.[% endif %]

# A package goes to the registry of its kind, unless nobody installs it from there, such
# as a private one that only its releases carry. publish_to follows this answer, and with
# it the variable PUBLISH_TO and every document that speaks of the delivery (decision 0093).
publish_package:
  type: bool
  help: Publish the package on the registry of its kind, npm or PyPI, with every release; no for a package that nobody installs from there, such as a private one
  default: true
  when: "{= project_type in ['node-package', 'python-package'] =}"

languages:
  type: yaml
  multiselect: true
  help: The languages of the code, which CodeQL analyzes (it has no PHP)
  choices:
    Python: python
    JavaScript or TypeScript: javascript-typescript
    Go: go
    Java or Kotlin: java-kotlin
    Ruby: ruby
    Rust: rust
  default: >-
    [%- if project_type in ['home-assistant', 'github-action', 'python-package'] -%][python]
    [%- elif project_type in ['node-package', 'chrome-extension', 'nextcloud-app'] -%][javascript-typescript]
    [%- else -%][][%- endif -%]

discussions:
  type: bool
  help: Use GitHub Discussions for questions, ideas and the announcements of releases
  default: true

successor:
  type: bool
  help: The owner has designated a successor through GitHub's account successor setting, who can take over the repository
  default: false

# The website that the Docs workflow publishes on GitHub Pages, at the address that
# mkdocs.yml names: the README, the About box of the repository, the issue forms and
# the manifest of an integration or an app link it.
homepage:
  type: str
  help: The website of the project; by default the one that the Docs workflow publishes on GitHub Pages, empty for none
  default: "https://{= owner | lower =}.github.io/[% if project_slug != (owner | lower) ~ '.github.io' %]{= project_slug =}/[% endif %]"
  validator: >-
    [% if homepage and not (homepage | regex_search('^https?://[A-Za-z0-9._~:/?#@!$&*+,;=%-]+$')) %]Name the address of the website, such as https://octo-org.github.io/demo/, or leave it empty.[% endif %]

# The topics of the repository on GitHub, with those of each kind by default: HACS
# lists an integration only with topics, and its check asks for them.
topics:
  type: str
  help: The topics of the repository, separated by commas; up to 20, each of lowercase letters, digits and hyphens
  default: >-
    [%- if project_type == 'home-assistant' -%]home-assistant, hacs, hacs-integration, home-assistant-integration, home-assistant-custom-component, homeassistant
    [%- elif project_type == 'nextcloud-app' -%]nextcloud, nextcloud-app
    [%- elif project_type == 'github-action' -%]github-actions, github-action
    [%- elif project_type == 'python-package' -%]{= 'python, pypi' if publish_package else 'python' =}
    [%- elif project_type == 'node-package' -%]{= 'typescript, nodejs, npm' if publish_package else 'typescript, nodejs' =}
    [%- elif project_type == 'chrome-extension' -%]chrome-extension, browser-extension, manifest-v3
    [%- elif project_type == 'container' -%]docker, container, ghcr
    [%- endif -%]
  validator: >-
    [%- set names = topics.split(',') | map('trim') | select | list -%]
    [%- if names and not (names | join(',') | regex_search('^([a-z0-9][a-z0-9-]{0,49}(,|$)){1,20}$')) -%]Separate up to 20 topics by commas, each of 50 characters at most, with lowercase letters, digits and hyphens, such as home-assistant.
    [%- elif project_type == 'home-assistant' and not names -%]HACS lists an integration only with topics, and its check asks for them: name at least one, such as home-assistant.
    [%- endif -%]

sponsor:
  type: str
  help: The GitHub Sponsors account of the sponsor button; empty for none
  default: "{= owner =}"
  validator: >-
    [% if sponsor and not (sponsor | regex_search('^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?$')) %]Name a GitHub account, or leave it empty.[% endif %]

# The GitHub App of the release and update pull requests, whose token starts their
# checks, signs the release tags and runs the bots. Empty for none yet: the checklist
# then points to app register, which registers one and names it in a pull request.
release_app:
  type: str
  help: >-
    The GitHub App of the owner that opens the release and update pull requests, by the
    name in its address (github.com/apps/NAME); empty to register one after the copy,
    as the checklist shows
  default: "[% if owner == blueprint_owner.account %]{= blueprint_owner.release_app =}[% endif %]"
  validator: >-
    [% if release_app and not (release_app | regex_search('^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$')) %]Name the app as its address does, github.com/apps/NAME, with lowercase letters, digits and hyphens, or leave it empty.[% endif %]

release_app_client_id:
  type: str
  help: The Client ID of the release app, on its settings page, such as Iv23li…
  default: "[% if release_app == blueprint_owner.release_app %]{= blueprint_owner.release_app_client_id =}[% endif %]"
  when: "{= release_app != '' =}"
  validator: >-
    [% if not (release_app_client_id | regex_search('^[A-Za-z0-9.]+$')) or release_app_client_id | regex_search('^[0-9]+$') %]Copy the Client ID from the settings page of the app, such as Iv23li…; the App ID is the number next to it.[% endif %]

release_app_id:
  type: str
  help: The App ID of the release app, the number on its settings page
  default: "[% if release_app == blueprint_owner.release_app %]{= blueprint_owner.release_app_id =}[% endif %]"
  when: "{= release_app != '' =}"
  validator: >-
    [% if not (release_app_id | regex_search('^[0-9]+$')) %]Copy the App ID, a number, from the settings page of the app.[% endif %]

# Who runs Renovate, which opens the updates of the dependencies: a workflow of the
# repository itself, as the release app; the Mend Renovate app, which the owner
# installs; or the Renovate workflow of the blueprint, which runs it for every
# repository of the blueprint's owner and only for them.
renovate_runner:
  type: str
  help: Who runs Renovate, which opens the updates of the dependencies
  choices:
    A Renovate workflow in this repository, as the release app (self): self
    The Mend Renovate app, which the owner installs (mend): mend
    The Renovate workflow of the blueprint, for the repositories of its owner (hub): hub
  default: "[% if owner == blueprint_owner.account %]hub[% else %]self[% endif %]"
  validator: >-
    [% if renovate_runner == 'hub' and owner != blueprint_owner.account %]The Renovate workflow of the blueprint runs only for the repositories of {= blueprint_owner.account =}: choose a workflow in this repository (self) or the Mend Renovate app (mend).[% elif renovate_runner != 'hub' and owner == blueprint_owner.account %]The Renovate workflow of the blueprint already runs for every repository of {= blueprint_owner.account =} that has its rules, so a second Renovate would fight it over the branches: choose the blueprint's workflow (hub).[% endif %]

# The issue assistant labels the issues and answers its commands without AI; with
# AI, the engine of .github/issue-assistant/config.toml, Claude, also analyzes each
# new issue, with its secret in the environment issue-assistant.
issue_assistant_ai:
  type: bool
  help: Let an AI engine, Claude, analyze each new issue, with its token as a secret of the environment issue-assistant
  default: true

sample_code:
  type: bool
  help: Start with sample code and tests; an existing repository that takes the blueprint answers no
  default: true

# The flaky-test bot watches the CI and Docker E2E of every repository; a repository
# whose other workflows run tests, such as visual tests, names them here.
test_workflows:
  type: str
  help: Other workflows of the repository that run tests, by their names and separated by commas, whose failed jobs the flaky-test bot runs once more; empty for none
  default: ""
  validator: >-
    [% if test_workflows and not (test_workflows | regex_search('^[A-Za-z0-9 ()._/,-]+$')) %]Name each workflow as the name: line of its file does, with letters, digits, spaces and ( ) . _ / - only, and separate them by commas.[% endif %]

# The flaky-test bot names the tests that pytest lists as failed in the log of a job.
# Other tests, such as the browser tests of a Docker E2E, write a line of their own
# as each test or step starts: the bot names the one that the log names last before
# the failure, and takes the first exception after that line as the error.
test_marker:
  type: str
  help: The text before the name of each test or step in the logs of the tests that pytest doesn't run, such as "Browser step:", by which the flaky-test bot names the test that failed; empty for none
  default: ""
  validator: >-
    [% if test_marker and not ((test_marker | trim) and (test_marker | regex_search('^[A-Za-z0-9 :()._/#>=-]+$'))) %]Write the text as the log writes it, with letters, digits, spaces and : ( ) . _ / # > = - only, and at least one that isn't a space.[% endif %]

# Derived from the answers; never asked and not stored.

stack:
  type: str
  when: false
  default: >-
    [%- if project_type == 'home-assistant' -%]home-assistant
    [%- elif project_type == 'nextcloud-app' -%]php
    [%- elif project_type in ['github-action', 'python-package'] -%]python
    [%- elif project_type in ['node-package', 'chrome-extension'] -%]node
    [%- elif project_type == 'container' -%]container
    [%- else -%]generic[%- endif -%]

publish_to:
  type: str
  when: false
  default: >-
    [%- if project_type in ['node-package', 'python-package'] and not publish_package -%]none
    [%- elif project_type == 'home-assistant' -%]hacs
    [%- elif project_type == 'nextcloud-app' -%]nextcloud-appstore
    [%- elif project_type == 'github-action' -%]github-action
    [%- elif project_type == 'python-package' -%]pypi
    [%- elif project_type == 'node-package' -%]npm
    [%- elif project_type == 'chrome-extension' -%]chrome-web-store
    [%- elif project_type == 'container' -%]ghcr
    [%- else -%]none[%- endif -%]

# The languages CodeQL analyzes, besides the workflows; it has no PHP.
codeql_languages:
  type: str
  when: false
  default: >-
    [%- set found = [] -%]
    [%- for language in ['python', 'javascript-typescript', 'go', 'java-kotlin', 'ruby', 'rust'] if language in languages -%]
    [%- set _ = found.append(language) -%]
    [%- endfor -%]
    [{= (found + ['actions']) | join(', ') =}]

# The workflow of the checks: the stack's, or one with the action's own test run.
ci_workflow:
  type: str
  when: false
  default: "[% if project_type == 'github-action' %]github-action[% else %]{= stack =}[% endif %]"

# Home Assistant needs the newest Python; actions run on the runner's Python 3.12.
python_version:
  type: str
  when: false
  default: "[% if stack == 'home-assistant' %]3.14[% else %]3.12[% endif %]"

# How the release bot finds the version: Python and Node in their manifests, the
# others in version.txt, with the version in other files kept equal.
release_type:
  type: str
  when: false
  default: >-
    [%- if project_type == 'python-package' -%]python
    [%- elif stack == 'node' -%]node
    [%- else -%]simple[%- endif -%]

# The slot of the schedules of this repository, so that the scheduled workflows of the
# repositories of one owner don't all start in the same minute and wait for the same
# runners (decision 0083): includes/replace.jinja moves each weekly schedule of a
# workflow of the blueprint by as many days, and every one by 8 minutes for each.
# The blueprint keeps its own times, slot 0; a repository of .github/fleet.toml takes
# its place in the Rollout, so that each has a day of its own; any other one a slot
# from the hash of its name.
schedule_slot:
  type: int
  when: false
  default: >-
    [%- set fleet -%][% include ".github/fleet.toml" %][%- endset -%]
    [%- set slot = namespace(value=((owner ~ '/' ~ project_slug) | hash('md5'))[:8] | int(base=16) % 28) -%]
    [%- if owner == blueprint_owner.account and project_slug == 'repo-blueprint' -%]
    [%- set slot.value = 0 -%]
    [%- elif ('\nowner = "' ~ owner ~ '"\n') in fleet -%]
    [%- for entry in fleet.split('[[repository]]')[1:] if ('\nname = "' ~ project_slug ~ '"\n') in entry -%]
    [%- set slot.value = entry | regex_search('\nrollout = [0-9]+\n') | trim | replace('rollout = ', '') | int -%]
    [%- endfor -%]
    [%- endif -%]
    {= slot.value =}
